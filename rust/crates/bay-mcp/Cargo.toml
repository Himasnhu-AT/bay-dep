[package]
name = "bay-mcp"
version = "0.1.0"
edition = "2024"
description = "Model Context Protocol server exposing the bay editor engine as agent tools."

[dependencies]
bay-agent = { path = "../bay-agent" }
bay-jobs = { path = "../bay-jobs" }
bay-core = { path = "../bay-core" }
bay-project = { path = "../bay-project" }
bay-preview = { path = "../bay-preview" }
# Sound effects are synthesised rather than downloaded — see bay_audio::sfx.
bay-audio = { path = "../bay-audio" }
bay-paths = { path = "../bay-paths" }
bay-text = { path = "../bay-text" }
bay-speech = { path = "../bay-speech" }
bay-provision = { path = "../bay-provision" }
bay-stock = { path = "../bay-stock" }
bay-vision = { path = "../bay-vision" }
bay-time = { path = "../bay-time" }
serde = { workspace = true }
serde_json = "1"
image = "0.25"
pollster = "0.4"

[dev-dependencies]
# T-002 capability gate: the mix tests measure real files, so they skip on a box with no
# ffmpeg and panic under BAY_REQUIRE_FFMPEG.
bay-test-support = { version = "0.1.0", path = "../bay-test-support" }
