[package]
name = "bay-html"
version = "0.1.0"
edition = "2024"
description = "HTML compositions rasterised to RGBA images by WebKit. No browser to download."

# Deliberately not a module of bay-gen. That crate is the consent-gated *generative* path — it
# reaches a third party over the network and every artifact it accepts carries a provenance
# receipt. This one reaches WebKit, which is already on the machine, and the bytes it produces
# are the caller's own markup. A caller that wants to draw a card must not have to link an
# HTTP client and a provenance verifier to get one.
#
# The renderer runs in a CHILD PROCESS on purpose — see `lib.rs`. WKWebView is AppKit, so it
# needs the main thread and a run loop; `bay --mcp` owns its main thread with the JSON-RPC loop
# and the editor owns its with GPUI. Neither can host a web view without being restructured
# around one, and a snapshot that wedges the server is worse than no snapshot.
[dependencies]
serde = { workspace = true }
image = "0.25"
serde_json = "1"
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# objc2 0.6 / objc2-foundation 0.3 / block2 0.6 are already resolved for the workspace through
# GPUI, and objc2-app-kit through the same. objc2-web-kit is the one crate this adds.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSData",
    "NSValue",
    "NSDate",
    "NSRunLoop",
    "NSError",
    "NSGeometry",
    "NSObject",
    # `setValue:forKey:`, which is the only way to reach WKWebView's `drawsBackground`. That
    # flag is what makes a transparent overlay transparent; there is no public setter.
    "NSKeyValueCoding",
    "NSDictionary",
    "NSArray",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    # `NSApplicationActivationPolicy` is declared here, not in NSApplication.
    "NSRunningApplication",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSColor",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKSnapshotConfiguration",
    "block2",
    # WKWebView is an NSView on macOS, so its superclass chain needs AppKit present.
    "objc2-app-kit",
    # `initWithFrame:configuration:` takes a CGRect, which lives here.
    "objc2-core-foundation",
] }

[dev-dependencies]
tempfile = "3"
image = "0.25"
