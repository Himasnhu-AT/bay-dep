[package]
name = "bay-listen"
version = "0.1.0"
edition = "2024"
description = "Local whisper.cpp speech-to-text and transcript editing for bay."

[dependencies]
bay-audio = { path = "../bay-audio" }
bay-paths = { path = "../bay-paths" }
bay-project = { path = "../bay-project" }
bay-provision = { path = "../bay-provision" }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }
