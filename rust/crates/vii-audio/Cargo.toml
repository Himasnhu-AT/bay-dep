[package]
name = "vii-audio"
version = "0.1.0"
edition = "2024"

# Extract a waveform peak envelope from an audio/video file via the ffmpeg CLI (decode → mono
# s16 PCM → per-bucket peaks). Single responsibility: file → normalized peaks for display.
[lib]
path = "src/lib.rs"
# The lib's libtest harness would otherwise also be a `cargo bench` target, and it rejects
# criterion's CLI flags — `cargo bench -p vii-audio -- --measurement-time 2` would fail.
bench = false

[dev-dependencies]
# T-002 capability gate. `gpu` is on so this crate's capability_report can name the adapter
# too — one report format across every gated crate.
test-support = { version = "0.1.0", path = "../test-support", features = ["gpu"] }
# `cargo_bench_support` only: plotters/rayon pull a large tree in for HTML reports we do not
# consume (numbers are read from stdout and recorded in docs/native/benchmarks.md).
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "mix_stereo"
harness = false
