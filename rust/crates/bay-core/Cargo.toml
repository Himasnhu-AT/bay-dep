[package]
name = "bay-core"
version = "0.1.0"
edition = "2024"

# The headless editor engine: one owned Editor over an EditorState (a Project +
# selection + clipboard), a serde-tagged Command enum that is simultaneously the
# undo/redo, autosave, and (future) MCP surface, reversible ProjectPatch history, and a
# coalesced EventBus. No GPU, no wasm, no per-manager Arc<RwLock>. The UI (bay-ui)
# reads state via the Query API and drives it with Commands.
[lib]
path = "src/lib.rs"
# The lib's libtest harness would otherwise also be a `cargo bench` target, and it rejects
# criterion's CLI flags — `cargo bench -p bay-core -- --measurement-time 2` would fail.
bench = false

[dependencies]
serde = { workspace = true }
bay-project = { version = "0.1.0", path = "../bay-project" }
# For the tick rate itself. Mirroring the constant instead is how two crates come to disagree
# about how long a second is.
bay-time = { version = "0.1.0", path = "../bay-time" }

[dev-dependencies]
serde_json = "1"
# `cargo_bench_support` only: plotters/rayon pull a large tree in for HTML reports we do not
# consume (numbers are read from stdout and recorded in docs/native/benchmarks.md).
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "commands"
harness = false
