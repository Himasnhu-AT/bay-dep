[package]
name = "native-preview"
version = "0.1.0"
edition = "2024"

# P0-GPU-03 — drives the reused Compositor::render_frame to a real native
# winit/wgpu window, replacing the wasm WebGPU/WebGL surface branch. This is the
# "always-surface" native present path and the proof that the compositor core
# renders outside the browser with no code changes to the engine crates.
[[bin]]
name = "native-preview"
path = "src/main.rs"

[dependencies]
compositor = { version = "0.1.0", path = "../compositor" }
gpu = { version = "0.1.0", path = "../gpu" }
pollster = "0.4"
winit = "0.30"
