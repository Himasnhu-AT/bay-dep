[package]
name = "vii-project"
version = "0.1.0"
edition = "2024"

# The editor's pure data model — Project → Scene → Tracks → Element — plus settings and
# stable references. Single responsibility: types + serde, no editing behavior (that lives
# in vii-core). Reuses `MediaTime` from the `time` crate as the one time representation.
[lib]
path = "src/lib.rs"
# The lib's libtest harness would otherwise also be a `cargo bench` target, and it rejects
# criterion's CLI flags — `cargo bench -p vii-project -- --measurement-time 2` would fail.
bench = false

[dependencies]
serde = { workspace = true }
# The project library reads and writes project JSON on disk, so serde_json is a real
# dependency here now — not just a dev one for the round-trip tests.
serde_json = "1"
vii-time = { version = "0.1.0", path = "../vii-time" }

[dev-dependencies]
serde_json = "1"
# `cargo_bench_support` only: plotters/rayon pull a large tree in for HTML reports we do not
# consume (numbers are read from stdout and recorded in docs/native/benchmarks.md).
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "project_serde"
harness = false
