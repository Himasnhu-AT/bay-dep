[package]
name = "opencut-project"
version = "0.1.0"
edition = "2024"

# The editor's pure data model — Project → Scene → Tracks → Element — plus settings and
# stable references. Single responsibility: types + serde, no editing behavior (that lives
# in opencut-core). Reuses `MediaTime` from the `time` crate as the one time representation.
[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
time = { version = "0.1.0", path = "../time" }

[dev-dependencies]
serde_json = "1"
