[package]
name = "opencut-mcp"
version = "0.1.0"
edition = "2024"
description = "Model Context Protocol server exposing the vii editor engine as agent tools."

[dependencies]
opencut-core = { path = "../opencut-core" }
opencut-project = { path = "../opencut-project" }
opencut-preview = { path = "../opencut-preview" }
opencut-text = { path = "../opencut-text" }
opencut-speech = { path = "../opencut-speech" }
time = { path = "../time" }
serde = { workspace = true }
serde_json = "1"
image = "0.25"
pollster = "0.4"

[[bin]]
name = "vii-mcp"
path = "src/main.rs"
