[package]
name = "bay-speech"
version = "0.1.0"
edition = "2024"
description = "Kokoro text-to-speech, and subtitle cues, for the bay editor."

[dependencies]
bay-paths = { path = "../bay-paths" }
# For the one definition of where a provisioned venv lives. Duplicating that path here is how
# narration ends up reporting "not installed" next to a working 858 MB environment.
bay-provision = { path = "../bay-provision" }
serde = { workspace = true }
serde_json = "1"
bay-time = { path = "../bay-time" }
