[package]
name = "opencut-core"
version = "0.1.0"
edition = "2024"

# P0-ARCH-01 — the headless engine seed. This crate proves the central-EditorState
# + stateless-free-function borrow model on the two pure managers (Selection,
# Clipboard) before the rest of Phase 1 is built on top of it. No GPU, no wasm, no
# per-manager Arc<RwLock>: one owned Editor, a serde-tagged Command enum that is
# simultaneously the undo/redo, autosave, and (future) MCP surface, and a coalesced
# EventBus that emits exactly one event per command.
[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = "1"
