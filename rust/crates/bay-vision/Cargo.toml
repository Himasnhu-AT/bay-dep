[package]
name = "bay-vision"
version = "0.1.0"
edition = "2024"
description = "SigLIP image-text embeddings, so a picture can be found by describing it."

[dependencies]
bay-paths = { path = "../bay-paths" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }

# candle rather than a Python sidecar or ONNX Runtime.
#
# The sidecar was the paved road — bay-speech already supervises one — but it would have made
# visual search depend on the 1.2 GB speech component, and on a `huggingface_hub` that fetches
# weights on import unless every environment variable is right. ONNX Runtime wants a third
# provisioned artifact (the dylib, per target) and its default feature downloads it at *build*
# time, which no policy here sanctions.
#
# candle needs exactly two files on disk and no interpreter, which is also the only one of the
# three that is honestly "runs on your machine" rather than "runs on your machine, in Python".
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }

# Accelerate, not Metal, and definitely not candle's wgpu backend.
#
# Metal was tried first and does not work: candle 0.9's Metal backend has no kernel for
# `layer-norm` or `softmax-last-dim`, so every SigLIP forward pass fails at the first encoder
# block with "no metal implementation for layer-norm". That is a missing kernel, not a
# misconfiguration, and there is nothing to set to make it work.
#
# So: CPU, with Apple's Accelerate as the BLAS — the fastest path that actually completes a
# forward pass here. Revisit Metal when candle ships the two kernels.
#
# wgpu is out regardless — `wgpu = "=29.0.1"` is pinned across the workspace for the compositor,
# and a second wgpu major linked in beside it is a build break with a very confusing message.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["accelerate"] }
candle-nn = { version = "0.9", features = ["accelerate"] }

[dev-dependencies]
bay-test-support = { path = "../bay-test-support" }
image = { version = "0.25", default-features = false, features = ["png"] }
