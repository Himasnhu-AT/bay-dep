[package]
name = "vii-ui"
version = "0.1.0"
edition = "2021"

# The GPUI view layer for the native editor. Single responsibility: render the editor's
# state and translate user interaction into vii-core Commands. Presentation logic that
# doesn't need GPUI lives in the pure, unit-tested `view_model` module.
[lib]
path = "src/lib.rs"

[dependencies]
gpui = "0.2.2"
image = "0.25"
vii-agent = { version = "0.1.0", path = "../vii-agent" }
vii-audio = { version = "0.1.0", path = "../vii-audio" }
vii-core = { version = "0.1.0", path = "../vii-core" }
vii-preview = { version = "0.1.0", path = "../vii-preview" }
rfd = "0.15"
rodio = "0.19"
serde_json = "1"

[dev-dependencies]
# GPUI's headless test context, so the shell's routing (list → editor → back) is verified
# without a display — the launcher is the one part of the UI that owns real state transitions.
gpui = { version = "0.2.2", features = ["test-support"] }
