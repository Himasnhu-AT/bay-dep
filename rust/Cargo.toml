[workspace]
resolver = "2"
members = [
    "desktop",
    "crates/bay-paths",
    "crates/bay-jobs",
    "crates/bay-provision",
    "crates/bay-time",
    "crates/bay-effects",
    "crates/bay-gpu",
    "crates/bay-html",
    "crates/bay-masks",
    "crates/bay-compositor",
    "crates/bay-agent",
    "crates/bay-core",
    "crates/bay-detect",
    "crates/bay-repair",
    "crates/bay-mcp",
    "crates/bay-listen",
    "crates/bay-speech",
    "crates/bay-project",
    "crates/bay-settings",
    "crates/bay-audio",
    "crates/bay-preview",
    "crates/bay-text",
    "crates/bay-ui",
    "crates/bay-stock",
    "crates/bay-gen",
    "crates/bay-vision",
    "crates/bay-test-support",
    "crates/bay-bench",
]

# P0-GPU-01 — single frozen wgpu major for the whole native workspace.
# The compositor/effects/masks/gpu crates and the GPUI desktop shell must share
# ONE wgpu Device/Texture for the zero-readback preview interop (P0-GPU-04). Any
# GPU crate added later (a pinned GPUI, a single-wgpu vello) MUST align to this
# exact version. Pinned with `=` so a stray `cargo update` cannot split the major.
# vello is intentionally absent (wants wgpu 28); revisit only if single-wgpu vello ships.
[workspace.dependencies]
wgpu = "=29.0.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
