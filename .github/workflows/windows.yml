name: windows

# The only thing this repo uses a runner for, and only when asked.
#
# macOS is built locally (`./script/bundle-mac --dmg`) and tested locally (`./test.sh`), so
# there is no push- or PR-triggered CI at all: on a private repo a macOS runner bills at 10x,
# and duplicating checks that already run on the maintainer's machine is paying for an echo.
#
# Windows genuinely cannot be built locally on a Mac. Windows containers need a Windows kernel,
# and cross-compiling with cargo-xwin dies inside gpui, whose build.rs gates HLSL shader
# compilation on the HOST being Windows — so `shaders_bytes.rs` is never generated. See todo.md.
#
# Manual only. Trigger it and get the zip back on your Mac with:
#
#   ./script/build-windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bundle
        run: .\script\bundle-windows.ps1 -Zip
        shell: pwsh

      # A GUI cannot be launched on a headless runner, but a link error or a missing DLL shows
      # up here rather than on someone's desktop. This runs the shipped binary, not a target/
      # path, so it also catches a bundle that assembled the wrong file.
      - name: Smoke test
        run: |
          $exe = "rust\target\release\bundle\windows\bay\bay.exe"
          if (-not (Test-Path $exe)) { throw "the bundle produced no bay.exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "bay.exe --help failed" }

          # One executable is the point of this layout — if a second one reappears, the README
          # and the download instructions are quietly wrong.
          $exes = Get-ChildItem "rust\target\release\bundle\windows\bay" -Filter *.exe
          if ($exes.Count -ne 1) { throw "expected exactly one .exe, found: $($exes.Name -join ', ')" }

          # A console-subsystem binary makes Windows open a black terminal behind the editor.
          # Only the PE header says which it is, and only a Windows machine can be asked — so
          # this is checked here rather than trusted to a cfg_attr nobody can see the effect of.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) {
            throw "bay.exe is subsystem $subsystem (2=GUI, 3=console) — it will spawn a console window"
          }
          Write-Host "  subsystem: GUI (no console window)"
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: bay-windows
          path: rust/target/release/bundle/windows/*.zip
          # Long enough to be useful, short enough not to accumulate storage cost.
          retention-days: 30
