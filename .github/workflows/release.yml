name: release

# Tag a version to cut a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab to get artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Apple silicon runner, but the bundle is universal — one download for every Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with both Mac targets
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bundle vii.app and a .dmg
        # Signing and notarization are skipped when the secrets are absent, which is what makes
        # this workflow useful on a fork: you still get a working (Gatekeeper-warned) build.
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_NOTARIZE_PROFILE: ${{ secrets.APPLE_NOTARIZE_PROFILE }}
        run: ./script/bundle-mac --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: vii-macos
          path: rust/target/release/bundle/osx/*.dmg

  windows:
    # Must build on Windows: GPUI's backend needs the Windows SDK and D3D headers, so there is
    # no cross-compile path from macOS or Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Bundle a Windows zip
        run: .\script\bundle-windows.ps1 -Zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: vii-windows
          path: rust/target/release/bundle/windows/*.zip

  publish:
    needs: [macos, windows]
    # Only a tag makes a release; a manual run just leaves the artifacts to download.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installing

            **macOS** — open the `.dmg` and drag vii to Applications.
            If it is not notarized, macOS blocks it on first run: right-click → Open, once.

            **Windows** — unzip and run `vii.exe`.
            If it is not signed, SmartScreen warns once: More info → Run anyway.

            ### Both platforms need
            - **ffmpeg** on `PATH` — decode, probing, MP4 export
            - **a GPU** for the compositor

            Narration additionally needs the Kokoro sidecar; vii says what is missing rather
            than failing silently.
