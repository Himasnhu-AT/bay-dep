name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

jobs:
  rust-mac:
    runs-on: macos-latest
    # macOS runners bill at 10x on a private repo, so this job costs roughly 120 billed
    # minutes a run — about fifteen pushes would exhaust a free month's allowance by itself.
    #
    # It is also the most redundant job here: development happens on a Mac, where `./test.sh`
    # runs exactly this. So it runs where it earns its cost — pull requests, release tags, and
    # on demand — rather than on every push. `rust-linux` stays the every-push tripwire.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')

    env:
      VII_REQUIRE_GPU: "1"
      VII_REQUIRE_FFMPEG: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # vii-audio and vii-preview shell out to `ffmpeg`; nothing links against it.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Format
        run: cargo fmt --all --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      - name: Test
        run: cargo test --workspace
        working-directory: rust

  # Deliberately no VII_REQUIRE_* here. This runner has no GPU and no ffmpeg, so a green run
  # is the proof that every capability-gated test still skips gracefully instead of failing.
  rust-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # GPUI (vii-ui) and rodio need these to build at all on Linux; they say nothing
      # about what the tests can actually exercise here.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Test
        run: cargo test --workspace
        working-directory: rust
