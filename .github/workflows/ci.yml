name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace overrides opencut-wasm to the locally-built pkg, so the Rust
      # core must be compiled before `pnpm install`.
      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build WASM
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg
        # (rust/ is the Rust workspace root; the web stack lives in dep/)

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dep

      - name: Test
        run: pnpm --filter @opencut/web test
        working-directory: dep

      - name: Build
        run: pnpm --filter @opencut/web build
        working-directory: dep

  # The native editor's home platform: Metal and the ffmpeg CLI are both really present, so
  # VII_REQUIRE_* turns a missing capability into a loud failure instead of a silent skip.
  # This is the only job that lints; `rust-linux` exists purely to exercise the skip path.
  rust-mac:
    runs-on: macos-latest

    env:
      VII_REQUIRE_GPU: "1"
      VII_REQUIRE_FFMPEG: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # opencut-audio and opencut-preview shell out to `ffmpeg`; nothing links against it.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Format
        run: cargo fmt --all --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      - name: Test
        run: cargo test --workspace
        working-directory: rust

  # Deliberately no VII_REQUIRE_* here. This runner has no GPU and no ffmpeg, so a green run
  # is the proof that every capability-gated test still skips gracefully instead of failing.
  rust-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # GPUI (opencut-ui) and rodio need these to build at all on Linux; they say nothing
      # about what the tests can actually exercise here.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Test
        run: cargo test --workspace
        working-directory: rust
