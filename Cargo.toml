[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "rust/crates/time",
    "rust/crates/bridge",
    "rust/crates/effects",
    "rust/crates/gpu",
    "rust/crates/masks",
    "rust/wasm", "rust/crates/compositor",
    "rust/crates/native-preview",
    "rust/crates/opencut-core",
    "rust/crates/opencut-project",
    "rust/crates/opencut-audio",
    "rust/crates/opencut-preview",
    "rust/crates/opencut-text",
    "rust/crates/opencut-ui",
]

# P0-GPU-01 — single frozen wgpu major for the whole native workspace.
# The compositor/effects/masks/gpu crates and the GPUI desktop shell must share
# ONE wgpu Device/Texture for the zero-readback preview interop (P0-GPU-04). Any
# GPU crate added later (a pinned GPUI, a single-wgpu vello) MUST align to this
# exact version. Pinned with `=` so a stray `cargo update` cannot split the major.
# vello is intentionally absent (wants wgpu 28); revisit only if single-wgpu vello ships.
[workspace.dependencies]
wgpu = "=29.0.1"
bytemuck = { version = "1.25.0", features = ["derive"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
