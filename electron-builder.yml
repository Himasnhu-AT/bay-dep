appId: com.freeholt.bay
productName: bay
copyright: Freeholt

directories:
  buildResources: build
  # Not `dist`: every JS toolchain treats that as its own build output (see CLAUDE.md on the
  # retired `dist` script). These are packaged apps, so they go where the name says.
  output: release

# Electron's fuses, flipped in the packaged binary. `runAsNode` stays on: the MCP proxy runs this
# binary as Node (ELECTRON_RUN_AS_NODE) — turning it off would break every agent connection.
# Inspect arguments go off, so a local process cannot attach a debugger to the signed app and
# borrow its permissions. The probes' --remote-debugging-port is a Chromium switch, not this one,
# and development runs the unfused binary in node_modules anyway.
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: false
  # Flipping a fuse rewrites the binary, and on Apple silicon macOS SIGKILLs a binary whose
  # signature no longer matches — measured: the unsigned bundle died with 137 on launch. An
  # unsigned build (identity: null) is never re-signed afterwards, so re-sign it ad hoc here.
  # A signed release is signed after the fuses anyway; this changes nothing for it.
  resetAdHocDarwinSignature: true

files:
  - out/**
  - package.json
  - '!**/*.map'

# The ffmpeg binaries cannot live inside the asar archive: the OS cannot spawn a file that is
# not on disk. This works in development and fails only in a packaged build, which is the worst
# kind of packaging bug to find late.
#
# The database used to need the same treatment and no longer does — it is `node:sqlite`, built
# into the runtime, so there is no native module here to unpack, rebuild, or keep in step with
# Electron's ABI.
asarUnpack:
  - node_modules/ffmpeg-ffprobe-static/**
  # The same reason for the Agent SDK's Claude Code binary (`BAY_AGENT_RUNTIME=sdk`), which
  # ships in a per-platform optional dependency. `bundledExecutable()` in src/main/agent/sdk.ts
  # rewrites the resolved `app.asar/…` path to `app.asar.unpacked/…`, and finds nothing unless
  # this entry put the file there.
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**

# No electron-builder publish provider. The in-app updater's feed is `UPDATE_FEED` in
# src/shared/update-feed.ts (a generic https folder, unset until there is somewhere to publish),
# and script/release-signed writes the files that go there: the notarized zip and
# latest-mac.yml. electron-builder never uploads anything.
publish: null

mac:
  icon: build/icon.icns
  category: public.app-category.video
  # arm64 only: the binaries under asarUnpack are the ones installed for THIS Mac.
  # ffmpeg-ffprobe-static downloads one platform's ffmpeg, and pnpm installs only the host's
  # claude-agent-sdk-darwin-* package. An x64 build made on Apple silicon would ship an arm64
  # ffmpeg and no `claude` at all. script/release-signed refuses any Mach-O missing the arch.
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Signing is off here. `identity: null` makes that explicit: without it electron-builder hunts
  # the keychain and silently picks whatever it finds, so a build's signature would depend on
  # which machine ran it. `pnpm release` is the unsigned build.
  #
  # `pnpm release:signed` (script/release-signed) is the one place signing is turned on, with
  # the identity and notary profile named in .bay-release. It signs every Mach-O (app.asar.unpacked
  # included) with the hardened runtime, notarizes with `notarytool --keychain-profile`, staples,
  # and verifies with codesign, stapler and spctl. The entitlements are the measured minimum
  # (see build/entitlements.mac.plist).
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: bay does not use the camera.
    NSMicrophoneUsageDescription: bay does not use the microphone.
  # Every document bay opens is one of its own; it claims nothing else.
  fileAssociations:
    - ext: bay
      name: bay project
      role: Editor

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - AppImage
  category: AudioVideo
