appId: com.freeholt.bay
productName: bay
copyright: Freeholt

directories:
  buildResources: build
  # Not `dist`: every JS toolchain treats that as its own build output (see CLAUDE.md on the
  # retired `dist` script). These are packaged apps, so they go where the name says.
  output: release

# Electron's fuses, flipped in the packaged binary. `runAsNode` stays on: the MCP proxy runs this
# binary as Node (ELECTRON_RUN_AS_NODE) — turning it off would break every agent connection.
# Inspect arguments go off, so a local process cannot attach a debugger to the signed app and
# borrow its permissions. The probes' --remote-debugging-port is a Chromium switch, not this one,
# and development runs the unfused binary in node_modules anyway.
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: false
  # Flipping a fuse rewrites the binary, and on Apple silicon macOS SIGKILLs a binary whose
  # signature no longer matches — measured: the unsigned bundle died with 137 on launch. An
  # unsigned build (identity: null) is never re-signed afterwards, so re-sign it ad hoc here.
  # A signed release is signed after the fuses anyway; this changes nothing for it.
  resetAdHocDarwinSignature: true

files:
  - out/**
  - package.json
  - '!**/*.map'
  # onnxruntime-node (visual search) ships every platform's native runtime in one package: 85 MB
  # for darwin/arm64 and ~200 MB more for Linux and Windows that a Mac build would carry for nothing.
  - '!node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**'
  # The package ships the runtime twice, as two identical 44 MB files: `libonnxruntime.1.dylib`
  # and `libonnxruntime.1.<minor>.<patch>.dylib`. The binding loads the first by name —
  # `otool -L onnxruntime_binding.node` lists `@rpath/libonnxruntime.1.dylib` and nothing else —
  # so the versioned copy is never loaded and is left out rather than unpacked and signed.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/*/libonnxruntime.1.*.*.dylib'

# bay's own LGPL ffmpeg (script/build-ffmpeg.sh → vendor/ffmpeg/<platform>-<arch>/) goes to
# Contents/Resources/ffmpeg/ as plain files: the OS cannot spawn a file inside the asar archive,
# and `vendoredTools()` in src/main/ffmpeg/vendor.ts looks there first. The licences and the
# BUILDINFO (version, configure line, source hashes) travel with the binaries, which is what the
# LGPL asks of anyone shipping them. `beforePack` refuses to package when the binaries for the
# platform/arch being packed are missing or are not the ones BUILDINFO records.
beforePack: script/check-ffmpeg-vendor.cjs
extraResources:
  - from: vendor/ffmpeg/${platform}-${arch}
    to: ffmpeg
    filter: [ffmpeg, ffprobe, ffmpeg.exe, ffprobe.exe, BUILDINFO]
  - from: vendor/ffmpeg/LICENSES
    to: ffmpeg/LICENSES
  - from: vendor/ffmpeg/README.md
    to: ffmpeg/README.md
  # The notice and the written source offer for the above, next to the files they describe.
  - from: NOTICE
    to: NOTICE

# The database used to need unpacking and no longer does — it is `node:sqlite`, built into the
# runtime, so there is no native module here to unpack, rebuild, or keep in step with Electron's
# ABI.
asarUnpack:
  # The Agent SDK's Claude Code binary (`BAY_AGENT_RUNTIME=sdk`) cannot be spawned from inside the
  # asar archive either; it ships in a per-platform optional dependency. `bundledExecutable()`
  # in src/main/agent/sdk.ts rewrites the resolved `app.asar/…` path to `app.asar.unpacked/…`, and finds nothing unless
  # this entry put the file there.
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # Visual search's runtime (src/main/vision/). A native module is `dlopen`ed from a real file,
  # never from inside the archive, and its binding loads `libonnxruntime.1.dylib` by @rpath from
  # its own folder — so the binding and the dylib are unpacked together. It is N-API
  # (bin/napi-v6), so there is no Electron ABI to rebuild for: measured loading under Electron 44
  # with ELECTRON_RUN_AS_NODE. script/release-signed signs both like any other Mach-O it finds.
  - node_modules/onnxruntime-node/bin/**

# No electron-builder publish provider. The in-app updater's feed is `UPDATE_FEED` in
# src/shared/update-feed.ts (a generic https folder, unset until there is somewhere to publish),
# and script/release-signed writes the files that go there: the notarized zip and
# latest-mac.yml. electron-builder never uploads anything.
publish: null

mac:
  icon: build/icon.icns
  category: public.app-category.video
  # arm64 only: pnpm installs only the host's claude-agent-sdk-darwin-* package, so an x64 build
  # made on Apple silicon would ship no `claude` at all (vendor/ffmpeg has both arches).
  # script/release-signed refuses any Mach-O in the bundle that lacks the target arch.
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Signing is off here. `identity: null` makes that explicit: without it electron-builder hunts
  # the keychain and silently picks whatever it finds, so a build's signature would depend on
  # which machine ran it. `pnpm release` is the unsigned build.
  #
  # `pnpm release:signed` (script/release-signed) is the one place signing is turned on, with
  # the identity and notary profile named in .bay-release. It signs every Mach-O (app.asar.unpacked
  # included) with the hardened runtime, notarizes with `notarytool --keychain-profile`, staples,
  # and verifies with codesign, stapler and spctl. The entitlements are the measured minimum
  # (see build/entitlements.mac.plist).
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: bay does not use the camera.
    NSMicrophoneUsageDescription: bay does not use the microphone.
  # Every document bay opens is one of its own; it claims nothing else.
  fileAssociations:
    - ext: bay
      name: bay project
      role: Editor

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - AppImage
  category: AudioVideo
