</head>
<body>
<div id="root" data-composition-id="bay-launch-2" data-start="0" data-width="1920" data-height="1080" data-duration="42.6667">
  <section id="stage" class="clip" data-start="0" data-duration="42.6667">
    <canvas id="c" width="1920" height="1080"></canvas>
  </section>
</div>
<script src="bay-motion.js"></script>
<script>
(function () {
  'use strict';
  // ---- the film, as numbers -------------------------------------------------------------------
  const W = 1920, H = 1080, FPS = 30, DUR = 1280 / 30;
  const b = (n) => (n * 2) / 3; // one beat at 90 BPM is 20 frames
  const T = {
    drop: 0.6,
    push: b(4),
    type0: 3.6, type1: 6.0,
    send: b(10),
    card1: b(11.5),
    syncGo: b(12), syncMove: 8.8, syncLine: 9.75, syncBack: b(16), syncDone: b(17),
    card2: b(18.5), hl: b(19), hlGo: b(20), mark1: b(21), mark2: b(21.25), hlDone: b(21.5), zoom: b(22),
    card3: b(22.5), swGo: b(23), cuts: b(24), swView: b(26), hit0: b(27), hit1: b(28), hit2: b(29), swBack: b(30), swDone: b(31),
    burst: b(32), pauses: b(33), pausesDone: b(33.5),
    lvlGo: b(34), lvl: b(35), lvlDone: b(35.5),
    subGo: b(36), sub: b(37), subDone: b(37.75),
    card7: b(39), cvGo: b(40), flip: b(41.5), cvBack: b(44), cvDone: b(45),
    changes: b(46), wide: b(51), end: b(55), mark: b(56), line1: b(58), line2: b(60)
  };
  const TR = T.send + 0.1; // the release: the message leaves the composer
  const BEATS = [0, T.push, T.syncGo, T.syncBack, T.hlGo, T.swGo, T.swView, T.swBack, T.burst, T.lvlGo, T.subGo, T.cvGo, T.cvBack, T.changes, T.wide, T.end];

  const C = {
    bg: '#121212', panel: '#181818', raised: '#212121', line: '#2a2a2a', line2: '#343434',
    ink: '#ededed', soft: '#bdbdbd', mute: '#8a8a8a', dim: '#5e5e5e',
    accent: '#d9773f', play: '#e5484d', ok: '#4cc38a', amber: '#F5A524', sky: '#5ab8ff'
  };
  const SANS = 'Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif';
  const MONO = '"SF Mono", ui-monospace, Menlo, monospace';
  const lerp = BM.lerp, clamp = BM.clamp, P = BM.progress;
  const ez = (n) => BM.EASES[n] || BM.EASES.cubicInOut;
  const E = (n, t, t0, t1) => ez(n)(P(t, t0, t1));
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // ---- the camera: one camera over the editor -------------------------------------------------
  const SHOT = {
    WIDE: { x: 960, y: 540, zoom: 1 },
    AG: { x: 1483.6, y: 800, zoom: 2.2 },     // the Agent panel: composer and the newest cards
    TL: { x: 875, y: 741, zoom: 1.76 },       // the timeline
    A: { x: 1120, y: 630, zoom: 1.2 },        // timeline and the cards together
    A2: { x: 1414.7, y: 795.8, zoom: 1.9 },   // the mic lanes and the cards
    B: { x: 1120, y: 494, zoom: 1.2 },        // viewer and the cards together
    VT: { x: 727.5, y: 489, zoom: 1.32 },     // viewer over the camera tracks
    VW: { x: 875, y: 351, zoom: 1.76 },       // the viewer
    VW2: { x: 875, y: 326, zoom: 2 }          // the viewer, closer, as the canvas turns
  };
  const mv = (t0, d, s, curve) => [{ t: t0 }, { t: t0 + d, x: s.x, y: s.y, zoom: s.zoom, curve: curve }];
  const KEYS = [{ t: 0, x: 960, y: 540, zoom: 1 }].concat(
    mv(T.push, 0.8, SHOT.AG, 'cubicInOut'),
    mv(T.syncGo, 0.6, SHOT.TL, 'expoInOut'),
    mv(T.syncBack, 0.6, SHOT.AG, 'expoInOut'),
    mv(T.hlGo, 0.55, SHOT.A, 'cubicInOut'),
    mv(T.swGo, 0.5, SHOT.TL, 'quintInOut'),
    mv(T.swView, 0.6, SHOT.VT, 'cubicInOut'),
    mv(T.swBack, 0.6, SHOT.AG, 'expoInOut'),
    mv(T.burst, 0.5, SHOT.A, 'expoInOut'),
    mv(T.lvlGo, 0.45, SHOT.A2, 'quintInOut'),
    mv(T.subGo, 0.5, SHOT.B, 'quintInOut'),
    mv(T.cvGo, 0.6, SHOT.VW, 'cubicInOut'),
    mv(T.flip, 0.8, SHOT.VW2, 'quintInOut'),
    mv(T.cvBack, 0.6, SHOT.AG, 'expoInOut'),
    mv(T.wide, 0.9, SHOT.WIDE, 'sineInOut')
  );
  const camera = (t) => BM.cameraAt(t, KEYS);
  const WM = (t) => BM.layerMatrix(camera(t));

  // ---- the podcast: shots, pauses, clips ------------------------------------------------------
  const CLIPLEN = 96;
  const SHOTS = [], PAUSES = [];
  (function () {
    const LEN = [3.5, 2, 3, 2.5, 3.5, 2, 2.5, 3, 2.5, 3, 2.5, 3], PA = [0, 1, 3, 5, 6, 8, 10];
    let s = 42;
    LEN.forEach(function (L, i) {
      const e = s + L; let end = e;
      if (PA.indexOf(i) >= 0) { PAUSES.push([e, e + 1]); end = e + 1; }
      SHOTS.push({ a: s, speechEnd: e, b: end, who: i % 2 ? 'G' : 'H' });
      s = end;
    });
  })();
  const CL = [
    { name: 'Host cam.mov', lane: 1, kind: 'v', who: 'H', off: 0 },
    { name: 'Guest cam.mov', lane: 2, kind: 'v', who: 'G', off: 7 },
    { name: 'Host mic.wav', lane: 3, kind: 'a', who: 'H', off: 3.5 },
    { name: 'Guest mic.wav', lane: 4, kind: 'a', who: 'G', off: 11 }
  ];
  const TX0 = 490, TX1 = 1420, TW = 930, LY = 674, LH = 74;
  const viewWin = (t) => { const p = E('cubicInOut', t, T.zoom, T.zoom + 0.6); return [lerp(0, 40, p), lerp(100, 84, p)]; };
  const closeP = (t) => E('expoOut', t, T.pauses, T.pauses + 0.45);
  function squeeze(s, pr) {
    if (pr <= 0) return s;
    let cut = 0;
    for (let i = 0; i < PAUSES.length; i++) { const a = PAUSES[i][0], e = PAUSES[i][1]; if (s >= e) cut += e - a; else if (s > a) cut += s - a; }
    return s - cut * pr;
  }
  function tlState(t) {
    const v = viewWin(t), pr = closeP(t), pps = TW / (v[1] - v[0]);
    const ds = pps > 14 ? 0.2 : 0.4;
    return { v0: v[0], v1: v[1], pr: pr, pps: pps, ds: ds, bw: Math.max(1.4, ds * pps * 0.62), lv: E('quartOut', t, T.lvl, T.lvl + 0.4),
      rx: (s) => TX0 + (s - v[0]) * pps, x: (s) => TX0 + (squeeze(s, pr) - v[0]) * pps };
  }
  const X = (s, t) => tlState(t).x(s);
  const offS = (j, t) => CL[j].off * (1 - E('cubicInOut', t, T.syncMove + j * 0.1, T.syncMove + j * 0.1 + 0.7));
  const CUT_T = (i) => T.cuts + (i - 1) * 0.06;
  const playAt = (t) => (t < T.hit0 ? 0 : t < T.hit1 ? 43.5 : t < T.hit2 ? 47.3 : 50.3);
  const shotAt = (t) => (t < T.hit0 ? { who: 'H', pose: 0 } : t < T.hit1 ? { who: 'H', pose: 1 } : t < T.hit2 ? { who: 'G', pose: 1 } : { who: 'H', pose: 1 });
  function speaker(s) {
    if (s >= 42 && s < 82) { for (let i = 0; i < SHOTS.length; i++) { const sh = SHOTS[i]; if (s >= sh.a && s < sh.b) return s < sh.speechEnd ? sh.who : null; } return null; }
    const u = ((s % 7) + 7) % 7; return u < 3 ? 'H' : u < 3.5 ? null : u < 6.5 ? 'G' : null;
  }
  function wave(cl, s, k) {
    const sp = speaker(s), n = 0.42 + 0.58 * hash(k * 7.13 + cl.lane * 31.7);
    if (cl.kind === 'v') return (sp ? 0.6 : 0.07) * n;
    return (sp === cl.who ? 1 : sp ? 0.13 : 0.06) * n;
  }
  function pieces(cl, t) {
    if (cl.kind !== 'v' || t < T.cuts) return [{ a: 0, b: CLIPLEN, dim: 0 }];
    const out = []; let a = 0, who = 'H', idx = 0;
    for (let i = 1; i <= 11; i++) {
      if (t < CUT_T(i)) break;
      out.push({ a: a, b: SHOTS[i].a, off: who !== cl.who, td: CUT_T(i) });
      a = SHOTS[i].a; who = SHOTS[i].who; idx = i;
    }
    out.push({ a: a, b: CLIPLEN, off: idx === 11 && who !== cl.who, td: CUT_T(11) + 0.06 });
    return out.map((p) => ({ a: p.a, b: p.b, dim: p.off ? P(t, p.td, p.td + 0.18) : 0 }));
  }

  // ---- the viewer ---------------------------------------------------------------------------
  const PIC16 = { x: 484, y: 98, w: 782, h: 440, r: 0 }, PIC9 = { x: 751.25, y: 98, w: 247.5, h: 440, r: 0 };
  const picBox = (t) => BM.rectMorph(t, T.flip, T.flip + 0.8, PIC16, PIC9, { curve: 'quintInOut' });

  // ---- the Agent panel: a list anchored to the composer ---------------------------------------
  const L1 = 'Make a 40-second vertical short from the best', L2 = 'moment of this podcast.';
  const MSG = L1 + ' ' + L2;
  const TOOLS = ['sync_angles', 'find_highlights', 'switch_speakers', 'remove_silences', 'level_voices', 'add_subtitles', 'set_canvas'];
  const RESULTS = ['4 clips in sync', '0:42 – 1:22 · score 91', '12 shots', '7 pauses · −7.0 s', '−16 LUFS', 'spotlight · word by word', '1080 × 1920'];
  const DONE = [T.syncDone, T.hlDone, T.swDone, T.pausesDone, T.lvlDone, T.subDone, T.cvDone];
  const CHANGES = ['Synced 4 clips', 'Marked the best moment · 0:42 – 1:22', 'Cut to the speaker · 12 shots', 'Removed 7 pauses · −7.0 s', 'Levelled voices · −16 LUFS', 'Added subtitles · word by word', 'Canvas · 1080 × 1920'];
  const ITEMS = [
    { id: 'msg', t: TR, h: 68 },
    { id: 'card1', t: T.card1, h: 64 }, { id: 'card2', t: T.card2, h: 150 }, { id: 'card3', t: T.card3, h: 64 },
    { id: 'card4', t: T.burst, h: 64 }, { id: 'card5', t: T.lvlGo, h: 64 }, { id: 'card6', t: T.subGo, h: 64 }, { id: 'card7', t: T.card7, h: 64 },
    { id: 'changes', t: T.changes, h: 290 }
  ];
  const GAP = 8, LIST_B = 884, CX = 1436, CW = 468;
  function itemY(i, t) {
    let y = LIST_B - ITEMS[i].h;
    for (let j = i + 1; j < ITEMS.length; j++) y -= (ITEMS[j].h + GAP) * E('quartOut', t, ITEMS[j].t, ITEMS[j].t + 0.3);
    return y;
  }
  const MSG_A = { x: 1440, y: 904, w: 404, h: 68, r: 10 };
  const msgBox = (t) => BM.rectMorph(t, TR, TR + 0.45, MSG_A, { x: 1500, y: itemY(0, t), w: 404, h: 68, r: 14 }, { curve: 'expoOut' });
  const CH = { x: CX, y: LIST_B - 290, w: CW, h: 290, r: 10 }, FULL = { x: 0, y: 0, w: W, h: H, r: 0 };
  const endRect = (t) => BM.rectMorph(t, T.end, T.end + 0.6, CH, FULL, { curve: 'cubicInOut' });

  // ---- the hand -----------------------------------------------------------------------------
  const HAND = [
    { t: 0, x: 600, y: 360 }, { t: 0.55, x: 860, y: 840 }, { t: 0.8, x: 860, y: 840 }, { t: 1.4, x: 1040, y: 1170 }, { t: 1.6, x: 1040, y: 1170 },
    { t: 5.2, x: 1560, y: 1170 }, { t: 5.4, x: 1560, y: 1170 }, { t: 6.3, x: 1880, y: 1010 }, { t: 7.0, x: 1880, y: 1010 }, { t: 7.6, x: 2010, y: 1150 }
  ];
  const hand = (t) => BM.pointer(t, HAND, [T.send]);

  // ---- drawing helpers ------------------------------------------------------------------------
  function tx(c, s, x, y, px, wt, col, align, mono) {
    c.font = wt + ' ' + px + 'px ' + (mono ? MONO : SANS); c.fillStyle = col; c.textAlign = align || 'left'; c.textBaseline = 'middle'; c.fillText(s, x, y);
  }
  function rr(c, x, y, w, h, r) { w = Math.max(0, w); h = Math.max(0, h); c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
  function bx(c, x, y, w, h, r, fill, stroke) { rr(c, x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1; c.stroke(); } }
  function al(c, a, fn) { const p = c.globalAlpha; a = clamp(a, 0, 1); if (a <= 0) return; c.globalAlpha = p * a; fn(); c.globalAlpha = p; }
  function pop(c, cx, cy, s, dy, fn) { c.save(); c.translate(cx, cy + dy); c.scale(s, s); c.translate(-cx, -cy); fn(); c.restore(); }
  function check(c, cx, cy, s, col, lw) { c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(cx - 4.5 * s, cy + 0.3 * s); c.lineTo(cx - 1.3 * s, cy + 3.4 * s); c.lineTo(cx + 4.6 * s, cy - 3.2 * s); c.stroke(); c.lineCap = 'butt'; }
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const fmt = (s) => Math.floor(s / 60) + ':' + pad2(Math.round(s) % 60);
  const tc = (s) => { const f = Math.round(s * 30); return '00:' + pad2(Math.floor(f / 1800)) + ':' + pad2(Math.floor(f / 30) % 60) + ':' + pad2(f % 30); };

  function drawMark(c, x, y, h, ph) {
    const k = h / 78, B = [[0, 14, 68, '#4d6a8c'], [10, 36, 78, '#4d6a8c'], [0, 57, 53, '#3f8a5c']];
    for (let i = 0; i < 3; i++) { rr(c, x + B[i][0] * k, y + B[i][1] * k, B[i][2] * k, 16 * k, 3 * k); c.fillStyle = B[i][3]; c.fill(); }
    if (ph > 0) { c.fillStyle = C.accent; c.fillRect(x + 41 * k, y, 3 * k, 78 * k * ph); }
  }

  // ---- footage, drawn -------------------------------------------------------------------------
  function person(c, cx, y, u, o) {
    c.fillStyle = o.top; c.beginPath(); c.ellipse(cx, y + u * 1.1, u * 0.36, u * 0.38, 0, 0, 7); c.fill();
    c.fillStyle = o.neck; c.fillRect(cx - u * 0.05, y + u * 0.58, u * 0.1, u * 0.17);
    if (o.long) { c.fillStyle = o.hair; c.beginPath(); c.ellipse(cx, y + u * 0.47, u * 0.155, u * 0.21, 0, 0, 7); c.fill(); }
    c.fillStyle = o.skin; c.beginPath(); c.ellipse(cx, y + u * 0.45, u * 0.115, u * 0.15, 0, 0, 7); c.fill();
    c.fillStyle = o.hair; c.beginPath(); c.ellipse(cx, y + u * 0.385, u * 0.124, u * 0.105, 0, Math.PI, Math.PI * 2); c.fill();
    c.fillStyle = '#1c1410';
    c.beginPath(); c.arc(cx - u * 0.043, y + u * 0.452, u * 0.011, 0, 7); c.fill();
    c.beginPath(); c.arc(cx + u * 0.043, y + u * 0.452, u * 0.011, 0, 7); c.fill();
    if (o.glasses) { c.strokeStyle = '#2a211c'; c.lineWidth = Math.max(1, u * 0.007); c.beginPath(); c.arc(cx - u * 0.043, y + u * 0.452, u * 0.03, 0, 7); c.stroke(); c.beginPath(); c.arc(cx + u * 0.043, y + u * 0.452, u * 0.03, 0, 7); c.stroke(); }
    c.fillStyle = '#5a2c22';
    if (o.mouth) { c.beginPath(); c.ellipse(cx, y + u * 0.525, u * 0.026, u * 0.017, 0, 0, 7); c.fill(); }
    else c.fillRect(cx - u * 0.025, y + u * 0.522, u * 0.05, u * 0.007);
  }
  function drawShot(c, who, pose, x, y, w, h) {
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    const u = h, cx = x + w / 2, sx = cx - (u * 8) / 9, sw = (u * 16) / 9;
    if (who === 'H') {
      let g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#6a4732'); g.addColorStop(1, '#3a261c'); c.fillStyle = g; c.fillRect(sx, y, sw, h);
      g = c.createRadialGradient(sx + u * 0.34, y + u * 0.3, 0, sx + u * 0.34, y + u * 0.3, u * 0.55); g.addColorStop(0, 'rgba(255,196,128,0.6)'); g.addColorStop(1, 'rgba(255,196,128,0)'); c.fillStyle = g; c.fillRect(sx, y, sw, h);
      c.fillStyle = '#2a1b14'; c.fillRect(sx + u * 1.2, y + u * 0.3, u * 0.5, u * 0.022);
      const bk = ['#b5533c', '#d9a441', '#4d7ea8', '#e6dcc8', '#7a9a6a'];
      for (let i = 0; i < 5; i++) { c.fillStyle = bk[i]; c.fillRect(sx + u * (1.24 + i * 0.055), y + u * (0.3 - 0.13 - (i % 2) * 0.02), u * 0.04, u * (0.13 + (i % 2) * 0.02)); }
      person(c, cx + (pose ? u * 0.02 : 0), y, u, { top: '#2f4a66', neck: '#c99a78', skin: '#e2b48f', hair: '#2b1c15', mouth: pose });
      c.strokeStyle = '#141414'; c.lineWidth = u * 0.022; c.beginPath(); c.moveTo(cx + u * 0.62, y + u * 1.02); c.lineTo(cx + u * 0.2, y + u * 0.63); c.stroke();
      c.fillStyle = '#1b1b1b'; rr(c, cx + u * 0.1, y + u * 0.575, u * 0.12, u * 0.075, u * 0.035); c.fill();
    } else {
      let g = c.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#34787a'); g.addColorStop(1, '#183d42'); c.fillStyle = g; c.fillRect(sx, y, sw, h);
      g = c.createRadialGradient(sx + u * 1.4, y + u * 0.25, 0, sx + u * 1.4, y + u * 0.25, u * 0.6); g.addColorStop(0, 'rgba(170,240,225,0.35)'); g.addColorStop(1, 'rgba(170,240,225,0)'); c.fillStyle = g; c.fillRect(sx, y, sw, h);
      c.fillStyle = '#1f5a48';
      for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(sx + u * (0.2 + i * 0.045), y + u * (0.62 - (i % 3) * 0.09), u * 0.05, u * 0.14, (i - 2) * 0.35, 0, 7); c.fill(); }
      c.fillStyle = '#c9805a'; c.fillRect(sx + u * 0.21, y + u * 0.74, u * 0.16, u * 0.3);
      person(c, cx - (pose ? u * 0.015 : 0), y, u, { top: '#e3d2ae', neck: '#b07d5c', skin: '#c98f6b', hair: '#d6ad5c', long: true, glasses: true, mouth: pose });
      c.strokeStyle = '#141414'; c.lineWidth = u * 0.022; c.beginPath(); c.moveTo(cx - u * 0.62, y + u * 1.02); c.lineTo(cx - u * 0.2, y + u * 0.63); c.stroke();
      c.fillStyle = '#1b1b1b'; rr(c, cx - u * 0.22, y + u * 0.575, u * 0.12, u * 0.075, u * 0.035); c.fill();
    }
    c.restore();
  }
  function thumb(c, cl, x, y, w, h) {
    if (cl.kind === 'v') drawShot(c, cl.who, 0, x, y, w, h);
    else { c.fillStyle = '#1f4633'; c.fillRect(x, y, w, h); c.fillStyle = '#7fd9a8'; for (let i = 0; i < 26; i++) { const a = (0.18 + 0.82 * hash(i * 3.1 + cl.lane * 9.7)) * h * 0.36; c.fillRect(x + 8 + (i * (w - 16)) / 26, y + h / 2 - a, 2.4, a * 2); } }
    c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  const WORDS = ['we', 'cut', 'half', 'of', 'them'], WLINES = [[0, 1, 2], [3, 4]];
  function drawSubs(c, t, p) {
    if (t < T.sub) return;
    const size = p.h * 0.08; let last = -1;
    for (let i = 0; i < WORDS.length; i++) if (t >= T.sub + i * 0.1) last = i;
    c.save(); c.beginPath(); c.rect(p.x, p.y, p.w, p.h); c.clip();
    c.font = '800 ' + size + 'px ' + SANS; c.textAlign = 'left'; c.textBaseline = 'middle';
    const sp = c.measureText(' ').width;
    for (let li = 0; li < WLINES.length; li++) {
      const ln = WLINES[li]; let tw = 0; for (let k = 0; k < ln.length; k++) tw += c.measureText(WORDS[ln[k]]).width; tw += sp * (ln.length - 1);
      let x = p.x + p.w / 2 - tw / 2; const y = p.y + p.h * (0.75 + li * 0.098);
      for (let k = 0; k < ln.length; k++) {
        const i = ln[k], ww = c.measureText(WORDS[i]).width, wl = BM.wordLand(t, T.sub + i * 0.1, { rise: size * 0.7 });
        if (wl.op > 0) {
          c.save(); c.globalAlpha = c.globalAlpha * clamp(wl.op, 0, 1); c.translate(x + ww / 2, y + wl.y); c.scale(wl.s, wl.s);
          c.lineWidth = size * 0.16; c.strokeStyle = 'rgba(0,0,0,0.75)'; c.lineJoin = 'round'; c.strokeText(WORDS[i], -ww / 2, 0);
          c.fillStyle = i === last ? C.sky : '#ffffff'; c.fillText(WORDS[i], -ww / 2, 0); c.restore();
        }
        x += ww + sp;
      }
    }
    c.restore();

    const n = Math.floor(P(t, T.type0, T.type1) * MSG.length + 1e-6), typing = t >= T.type0 && t < TR;
    if (typing) {

      tx(c, l1, 1454, 928, 16, 400, C.ink); if (l2) tx(c, l2, 1454, 950, 16, 400, C.ink);

    } else {

    }
    tx(c, '@ Pin', 1454, 1005, 13, 500, C.soft); tx(c, 'Attach', 1518, 1005, 13, 500, C.soft); tx(c, 'Range', 1586, 1005, 13, 500, C.soft);
    const pr = BM.press(t, T.send), live = typing && n > 0;

      c.fillStyle = live ? C.accent : '#2e2e2e'; c.beginPath(); c.arc(1876, 1004, 16, 0, 7); c.fill();

      rr(c, m.x, m.y, m.w, m.h, m.r); c.fillStyle = 'rgba(52,52,52,' + clamp(m.p * 1.6, 0, 1).toFixed(3) + ')'; c.fill();

  }
  function drawStatus(c, t) {

  }
  function drawHand(c, t, M) {

  function drawWorld(c, t) {

  // ---- the end card: the Changes card, opened to the frame -----------------------------------
  const scratch = document.createElement('canvas'); scratch.width = W; scratch.height = H;
  const sc = scratch.getContext('2d');
  const WORD_PX = 200, MARK_H = 160, MARK_W = (MARK_H * 88) / 78, LOCK_GAP = 54, LOCK_Y = 372;

  const L1_Y = 642, L2_Y = 768;
  const lockPop = (t) => BM.cardPop(t, T.mark - 0.1);
  function lockBox(t) { const p = lockPop(t), w = LOCK_W * p.s, h = (MARK_H + 40) * p.s; return { x: 960 - w / 2, y: LOCK_Y - h / 2 + p.dy, w: w, h: h, op: p.op }; }

  function drawEnd(c, t) {

    });

  }
  function draw(c, t) {

    if (t < T.end + 0.6) drawWorld(c, t);

  // ---- what is on screen, in screen pixels: the oracle and the blur both read this -----------
  function clipY(bxx) { if (bxx.y + bxx.h <= 125) return null; const y = Math.max(bxx.y, 125); return { x: bxx.x, y: y, w: bxx.w, h: bxx.y + bxx.h - y, op: bxx.op }; }
  function track(t) {

  // ---- the frame: a 180° shutter, with as many sub-frames as the travel needs ------------------

  const SHUTTER = 0.5 / FPS, MAX_SUB = 12;
  function travel(t0, t1) {

      for (let i = 0; i < pts.length; i++) { const x0 = s0.x(pts[i]), x1 = s1.x(pts[i]); if (Math.min(x0, x1) < TX1 && Math.max(x0, x1) > TX0) far = Math.max(far, Math.abs(x1 - x0) * z); }

  const sxAt = (t, x, y) => BM.toScreen(WM(t), x, y)[0];

    add(T.pauses, 'knock', 0.5, sxAt(T.pauses, 955, 890), { size: 1.3, brightness: 0.4 });

})();
