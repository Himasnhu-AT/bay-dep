<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bay — give it a podcast, ask, and it edits</title>
    <style>
      body { margin: 0; background: #121212; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #121212; }
      .clip { position: absolute; inset: 0; }
      canvas { width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bay-launch" data-start="0" data-width="1920" data-height="1080" data-duration="42.3">
      <section id="stage" class="clip" data-start="0" data-duration="42.3">
        <canvas id="c" width="1920" height="1080"></canvas>
      </section>
    </div>
    <script src="bay-motion.js"></script>
    <script>
      // ---- the film, as numbers ------------------------------------------------------------
      const W = 1920, H = 1080, DUR = 42.3, FPS = 30;
      const C = {
        ground: '#121212', bar: '#1b1b1b', panel: '#171717', raised: '#212121', chip: '#262626', line: '#2b2b2b',
        ink: '#ededed', text: '#c9c9c9', mute: '#8a8a8a', dim: '#5e5e5e', accent: '#d9773f', play: '#e5484d',
        v: '#3f5d7d', a: '#3b6f50', sky: '#5ec4ff', ok: '#4cc38a', amber: '#f5a524'
      };
      const SANS = 'Inter, system-ui, -apple-system, "Helvetica Neue", sans-serif';
      const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
      const mc = document.createElement('canvas').getContext('2d');
      const tw = (s, font) => { mc.font = font; return mc.measureText(s).width; };

      // One table of times. Every time is snapped to a frame, so the picture changes on exactly the
      // frame its time names — and the sound, which reads the same table, lands on that frame too.
      const fr = (s) => Math.round(s * FPS) / FPS;
      const SENT = 'Make a 40-second vertical short from the best moment of this podcast.', BRK = 45;
      const T = {
        fileIn: 0.5, poolDrop: 1.1, grab: 1.367, clipDrop: 1.9, toPrompt: 2.7, promptClick: 3.267, type0: 3.367, send: 6.5,
        card: [7.3, 11.1, 14.55, 21.05, 23.75, 26.2, 29.75],     // each tool card appears
        out: [7.8, 11.5, 15.0, 21.4, 24.1, 26.55, 30.2],         // the camera leaves the card for the edit
        back: [10.2, 13.7, 20.2, 23.05, 25.5, 29.0, 32.5],       // and comes back
        done: [10.75, 14.2, 20.75, 23.5, 25.95, 29.45, 33.05],   // the card turns to a tick
        slide: [8.4, 8.75, 9.1], guide: 9.47,                    // sync_angles: three clips slide into line
        scroll: 11.95, light: 12.5, mk: [12.8, 13.0],            // find_highlights: transcript, passage, markers
        cuts: 15.55, up: 16.6, run: 17.2, runEnd: 19.6,          // switch_speakers: the cuts, then the playhead runs
        pmark: 21.85, close: 22.2,                               // remove_silences
        level: 24.55, lufs: 24.75,                               // level_voices
        subTrack: 27.0, word: [27.35, 27.55, 27.75, 27.95, 28.15], // add_subtitles
        flip: 30.75, flipLand: 31.3,                             // set_canvas
        changes: 33.4, row0: 33.9, rowStep: 0.133, revert: 35.0, wide: 36.2, end: 38.2, logoLand: 39.0, line1: 39.55, line2: 40.1
      };
      for (const k in T) T[k] = Array.isArray(T[k]) ? T[k].map(fr) : fr(T[k]);
      T.typeEnd = fr(T.type0 + SENT.length / 25);                // 25 characters a second
      const WQ = [0.467, 0.4, 0.467, 0.367, 0.367, 0.367, 0.467]; // how long each whip takes
      const typed = (t) => (t < T.type0 ? 0 : Math.min(SENT.length, Math.floor((t - T.type0) * 25 + 1e-6)));
      const keyTime = (i) => Math.ceil((T.type0 + (i + 1) / 25) * FPS - 1e-6) / FPS; // the frame key i first shows on

      // ---- layout: Bay's editor, edge to edge, as the home camera sees it -------------------
      const TOP = 52, MID = 642, STATUS = 1000, TABS = 1030;
      const POOL = { x: 0, w: 400 }, VIEW = { x: 400, w: 720 }, INSP = { x: 1120, w: 320 }, AG = { x: 1440, w: 480 };
      const TL = { x: 400, w: 1040, lane: 590, ruler: 684, rows: 716 };
      const ROW_H = 52, RG = 2, SUB_H = 40;
      const PPS = 9, LEN = 90;                                    // pixels per second; the recording is 1:30
      const TURNS = [0, 8, 15, 23, 30, 38, 46, 55, 61, 69, 77, 84, 90]; // who is talking: host first, then alternating
      const PAUSES = [[12, 1.0], [27, 0.9], [50, 1.1], [58.5, 1.0], [66, 0.9], [73, 1.1], [86, 1.0]];
      const REMOVED = PAUSES.reduce((s, p) => s + p[1], 0);
      const PICK = [42, 82];                                      // the best moment: 0:42 – 1:22
      const turnOf = (sec) => { let i = 0; while (i < TURNS.length - 2 && sec >= TURNS[i + 1]) i++; return i; };
      const whoAt = (sec) => (turnOf(sec) % 2 ? 'G' : 'H');
      const inPause = (sec) => PAUSES.some((p) => sec >= p[0] && sec < p[0] + p[1]);
      const ATOMS = (() => {
        const pts = new Set(TURNS); PAUSES.forEach((p) => { pts.add(p[0]); pts.add(p[0] + p[1]); });
        const a = [...pts].sort((x, y) => x - y), out = [];
        for (let i = 0; i < a.length - 1; i++) out.push({ a: a[i], b: a[i + 1], pause: inPause(a[i]), turn: turnOf(a[i]) });
        return out;
      })();
      const closeP = (t) => BM.EASES.expoOut(BM.progress(t, T.close, T.close + 0.3));
      function X(sec, t) { // where a moment of the recording sits on the timeline, once the pauses before it are gone
        const cp = closeP(t); let rem = 0;
        if (cp > 0) for (const p of PAUSES) rem += BM.clamp(sec - p[0], 0, p[1]);
        return TL.lane + PPS * (sec - rem * cp);
      }
      const TRACKS = [
        { id: 'vG', kind: 'v', who: 'G', badge: 'V2', name: 'Video 2', label: 'Guest cam', off0: 38, slide: 0 },
        { id: 'vH', kind: 'v', who: 'H', badge: 'V1', name: 'Video 1', label: 'Host cam', off0: 0 },
        { id: 'aH', kind: 'a', who: 'H', badge: 'A1', name: 'Audio 1', label: 'Host mic', off0: 62, slide: 1 },
        { id: 'aG', kind: 'a', who: 'G', badge: 'A2', name: 'Audio 2', label: 'Guest mic', off0: 30, slide: 2 }
      ];
      const offOf = (tr, t) => (tr.off0 ? tr.off0 * (1 - BM.EASES.expoOut(BM.progress(t, T.slide[tr.slide], T.slide[tr.slide] + 0.3))) : 0);
      const clipGrow = (t) => BM.EASES.expoOut(BM.progress(t, T.clipDrop, T.clipDrop + 0.3));
      const subOpen = (t) => BM.EASES.cubicOut(BM.progress(t, T.subTrack, T.subTrack + 0.3));
      const rowY = (i, t) => TL.rows + (SUB_H + RG) * subOpen(t) + i * (ROW_H + RG);
      const cutAt = (i) => T.cuts + (Math.max(1, i) - 1) * 0.07;  // the razor reaches boundary i
      const levelP = (t) => BM.EASES.cubicOut(BM.progress(t, T.level, T.level + 0.35));
      const gainOf = (tr, t) => BM.lerp(tr.who === 'H' ? 1 : 0.5, 0.78, levelP(t));
      const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const two = (n) => String(n).padStart(2, '0');
      const mss = (s) => Math.floor(s / 60) + ':' + two(Math.floor(s % 60));
      const tcode = (s) => { const f = Math.max(0, Math.round(s * 30)); return '00:' + two(Math.floor(f / 1800)) + ':' + two(Math.floor(f / 30) % 60) + ':' + two(f % 30); };
      function playSec(t) { // where the playhead is, in the recording's own seconds
        if (t < T.mk[1]) return 0;
        if (t < T.subTrack) return PICK[0] + 22 * BM.progress(t, T.run, T.runEnd);
        return 64 + 1.6 * BM.progress(t, T.subTrack + 0.2, T.word[4] + 0.3);
      }
      const whoShown = (t) => (t < T.slide[0] + 0.15 ? 'H' : t < T.cuts ? 'G' : whoAt(playSec(t))); // the top enabled camera under the playhead

      // The viewer's canvas: 16:9 fits the panel by width, 9:16 by height.
      const VC = { x: 760, y: 344 };
      const VIEW_A = { x: VC.x - 340, y: VC.y - 191.25, w: 680, h: 382.5, r: 2 };
      const VIEW_B = { x: VC.x - 135, y: VC.y - 240, w: 270, h: 480, r: 2 };
      function viewerBox(t) {
        const m = BM.rectMorph(t, T.flip, T.flipLand, VIEW_A, VIEW_B, { curve: 'quintInOut' });
        const hit = BM.impact(t, T.flipLand, { squashX: 0.04, squashY: 0.05 });
        const w = m.w * hit.sx, h = m.h * hit.sy;
        return { x: m.cx - w / 2, y: m.cy - h / 2, w, h, r: 2, p: m.p };
      }
      const WORDS = ['That', 'sounds', 'almost', 'too', 'simple.'], SUB_A = 34, SUB_B = 28;
      const WLAY = (() => {
        const fa = `800 ${SUB_A}px ${SANS}`, fb = `800 ${SUB_B}px ${SANS}`;
        const wa = WORDS.map((w) => tw(w, fa)), wb = WORDS.map((w) => tw(w, fb));
        const spa = tw(' ', fa) * 1.1, spb = tw(' ', fb) * 1.1, A = [], B = [];
        let x = VC.x - (wa.reduce((s, w) => s + w, 0) + spa * 4) / 2;
        wa.forEach((w) => { A.push({ cx: x + w / 2, cy: VIEW_A.y + VIEW_A.h - 48, w }); x += w + spa; });
        [[0, 1], [2, 3], [4]].forEach((ln, r) => {
          let lx = VC.x - (ln.reduce((s, i) => s + wb[i], 0) + spb * (ln.length - 1)) / 2;
          ln.forEach((i) => { B[i] = { cx: lx + wb[i] / 2, cy: VIEW_B.y + VIEW_B.h - 132 + r * 34, w: wb[i] }; lx += wb[i] + spb; });
        });
        return { A, B };
      })();
      function wordBox(t, i) {
        const p = viewerBox(t).p, a = WLAY.A[i], b = WLAY.B[i], land = BM.wordLand(t, T.word[i], { rise: 16 });
        const size = BM.lerp(SUB_A, SUB_B, p), w = BM.lerp(a.w, b.w, p) * land.s;
        const cx = BM.lerp(a.cx, b.cx, p), cy = BM.lerp(a.cy, b.cy, p) + land.y;
        return { cx, cy, size, s: land.s, x: cx - w / 2, y: cy - (size * land.s) / 2, w, h: size * land.s, op: land.op };
      }

      // The Agent panel.
      const PB = { x: 1456, y: 850, w: 448, h: 140, r: 14 };       // the prompt box
      const F_MSG = `400 17px ${SANS}`;
      const L1 = SENT.slice(0, BRK), L2 = SENT.slice(BRK + 1);
      const PRE1 = [], PRE2 = [];
      for (let i = 0; i <= L1.length; i++) PRE1.push(tw(L1.slice(0, i), F_MSG));
      for (let i = 0; i <= L2.length; i++) PRE2.push(tw(L2.slice(0, i), F_MSG));
      const MW = Math.max(PRE1[L1.length], PRE2[L2.length]) + 32;
      const MSG_A = { x: PB.x + 2, y: PB.y + 8, w: MW, h: 68, r: 14 }, MSG_B = { x: AG.x + AG.w - 16 - MW, y: 162, w: MW, h: 68, r: 14 };
      const msgBox = (t) => BM.rectMorph(t, T.send + 0.033, T.send + 0.467, MSG_A, MSG_B, { curve: 'cubicOut' });
      const CARDS = [
        { name: 'sync_angles', done: '4 clips in sync' },
        { name: 'find_highlights', done: '0:42 – 1:22 · score 91' },
        { name: 'switch_speakers', done: '12 shots' },
        { name: 'remove_silences', done: '7 pauses · −7.0 s' },
        { name: 'level_voices', done: '−16 LUFS' },
        { name: 'add_subtitles', done: 'Subtitles on V3' },
        { name: 'set_canvas', done: '1080 × 1920' }
      ];
      const cardRect = (i) => ({ x: 1456, y: 244 + i * 48, w: 448, h: 42, r: 9 });
      const agentY = (i) => Math.max(240, 244 + Math.min(i, 6) * 48 - 40);
      const CH = { x: 1456, y: 582, w: 448, h: 256, r: 12 };       // the Changes card
      const CH_ROWS = [['Synced 4 clips by sound', '4 clips'], ['Marked the best moment', '0:42 – 1:22'], ['Cut cameras to the speaker', '12 shots'], ['Removed 7 pauses', '−00:00:07:00'],
        ['Levelled 2 voices', '−16 LUFS'], ['Added Subtitles track', 'V3'], ['Canvas 16:9 → 9:16', '1080 × 1920']];

      // The media pool, the transcript, and the thing being dragged.
      const TILES = [{ x: 16, y: 250, who: 'H', kind: 'v', name: 'Host cam.mov' }, { x: 206, y: 250, who: 'G', kind: 'v', name: 'Guest cam.mov' },
        { x: 16, y: 392, who: 'H', kind: 'a', name: 'Host mic.wav' }, { x: 206, y: 392, who: 'G', kind: 'a', name: 'Guest mic.wav' }];
      const LINES = [[0, 'H', 'Welcome back to the show.'], [8, 'G', 'Thanks for having me.'], [15, 'H', 'You post a lot more these days.'], [23, 'G', 'We used to post once a month.'],
        [30, 'H', 'So what changed?'], [38, 'G', 'Honestly, one small habit.'], [42, 'G', 'We stopped waiting for the perfect take.'], [46, 'H', 'You just hit record?'],
        [55, 'G', 'Record, find the best bit, post it.'], [61, 'H', 'That sounds almost too simple.'], [69, 'G', 'It is simple. That is the point.'], [77, 'H', 'Okay, I am stealing that.'], [84, 'G', 'Please do.']];
      const LROW = 64, LTOP = 152, PASS = [6, 11];
      const scrollY = (t) => 190 * BM.EASES.cubicInOut(BM.progress(t, T.scroll, T.scroll + 0.5));
      const passBox = (t) => ({ x: 8, y: LTOP + PASS[0] * LROW - scrollY(t) - 2, w: 384, h: (PASS[1] - PASS[0] + 1) * LROW });
      const PK = [
        [T.fileIn, -70, 470], [T.poolDrop, 110, 320], [T.grab, 110, 320], [T.clipDrop, 650, 770], [T.clipDrop + 0.1, 650, 770],
        [T.clipDrop + 0.333, 760, 965], [T.toPrompt, 760, 965], [T.promptClick - 0.067, 1650, 900], [T.type0 + 1.5, 1650, 900],
        [T.typeEnd - 0.067, PB.x + PB.w - 28, PB.y + 112], [T.send + 0.167, PB.x + PB.w - 28, PB.y + 112], [T.send + 0.6, 1990, 1130]
      ];
      function pointerAt(t) { // straight, eased runs between rests: in a rest it does not move at all
        if (t <= PK[0][0]) return { x: PK[0][1], y: PK[0][2] };
        for (let i = 0; i < PK.length - 1; i++) {
          const a = PK[i], b = PK[i + 1];
          if (t <= b[0]) { const e = BM.EASES.cubicInOut(BM.progress(t, a[0], b[0])); return { x: BM.lerp(a[1], b[1], e), y: BM.lerp(a[2], b[2], e) }; }
        }
        const z = PK[PK.length - 1]; return { x: z[1], y: z[2] };
      }
      const CLICKS = [T.grab, T.promptClick, T.send];
      const pointerS = (t) => CLICKS.reduce((s, tc) => s * BM.press(t, tc - 0.1).s, 1);
      function ghostAt(t) { // the four files in the hand
        if ((t >= T.fileIn && t < T.poolDrop) || (t >= T.grab && t < T.clipDrop)) { const p = pointerAt(t); return { x: p.x + 16, y: p.y + 12, w: 132, h: 74, r: 6 }; }
        return null;
      }

      // The end card: the app's own mark and name, grown out of the top bar.
      const F_LOGO = `700 23px ${SANS}`;
      const LOCK_W = 38 + tw('bay', F_LOGO) + 2;
      const LOGO_A = { x: 36, y: 12, w: LOCK_W, h: 28, r: 0 };
      const LOGO_K = 7.2;
      const LOGO_B = { x: W / 2 - (LOCK_W * LOGO_K) / 2, y: 413 - 14 * LOGO_K, w: LOCK_W * LOGO_K, h: 28 * LOGO_K, r: 0 };
      const LINE1 = 'A video editor you can talk to.', LINE2 = 'On your own Mac. Every change on your undo stack.';
      const L1W = tw(LINE1, `600 63px ${SANS}`), L2W = tw(LINE2, `400 39px ${SANS}`), LINE1_Y = 620, LINE2_Y = 702;
      const irisAt = (t) => BM.iris(t, T.end, T.end + 0.75, 49, 26, { from: 14, curve: 'quartOut' });
      function logoBox(t) {
        const m = BM.rectMorph(t, T.end, T.logoLand, LOGO_A, LOGO_B, { curve: 'cubicInOut' });
        const hit = BM.impact(t, T.logoLand, { squashX: 0.03, squashY: 0.05 });
        const w = m.w * hit.sx, h = m.h * hit.sy;
        return { x: m.cx - w / 2, y: m.cy - h / 2, w, h };
      }
      const line1 = (t) => BM.lineReveal(t, T.line1, 0, { dist: 70 });
      const line2 = (t) => BM.lineReveal(t, T.line2, 0, { dist: 50 });

      // ---- the camera: it pushes, pulls or whips; between moves it is dead still -------------
      const WHIP = [0.72, 0, 0.18, 1];
      const AGENT = { x: 1620, zoom: 3.2 };
      const SHOT = [{ x: 940, y: 786, zoom: 1.85 }, { x: 685.7, y: 694.3, zoom: 1.4 }, { x: 940, y: 786, zoom: 1.85 }, { x: 1040, y: 820, zoom: 2.1 },
        { x: 784, y: 864, zoom: 2.5 }, { x: 800, y: 470, zoom: 1.45 }, { x: 950, y: 322, zoom: 1.9 }];
      const EXTRA = [
        [{ t: T.slide[0] }, { t: T.guide, x: 950, y: 800, zoom: 1.95, curve: 'sineInOut' }],                                   // push in while they line up
        [],
        [{ t: T.cuts }, { t: T.cuts + 0.8, x: 950, y: 800, zoom: 1.95, curve: 'sineInOut' }, { t: T.up },
          { t: T.up + 0.5, x: 880, y: 495, zoom: 1.4, curve: 'cubicInOut' }, { t: T.run }, { t: T.runEnd, y: 470, zoom: 1.5, curve: 'sineInOut' }], // up to viewer and cameras
        [{ t: T.pmark }, { t: T.close + 0.3, zoom: 2.2, curve: 'sineInOut' }],
        [],
        [{ t: T.subTrack }, { t: T.word[4] + 0.3, x: 780, y: 400, zoom: 1.7, curve: 'sineInOut' }],
        [{ t: T.flip }, { t: T.flipLand + 0.033, zoom: 2, curve: 'cubicOut' }]
      ];
      const KEYS = [
        { t: 0, x: 960, y: 540, zoom: 1 },
        { t: T.fileIn },
        { t: T.clipDrop + 0.3, x: 738.5, y: 560, zoom: 1.3, curve: 'cubicOut' },          // push in on the drop
        { t: T.toPrompt },
        { t: T.toPrompt + 0.467, x: 1600, y: 900, zoom: 3, curve: WHIP },                  // whip to the prompt box
        { t: T.type0 },
        { t: T.typeEnd, x: 1629, y: 916, zoom: 3.3, curve: 'sineInOut' },                  // push in while it is typed
        { t: T.send + 0.033 },
        { t: T.send + 0.5, x: AGENT.x, y: agentY(0), zoom: AGENT.zoom, curve: WHIP }       // up to the chat with the message
      ];
      for (let i = 0; i < 7; i++) {
        KEYS.push({ t: T.out[i] }, Object.assign({ t: T.out[i] + WQ[i], curve: WHIP }, SHOT[i]));
        EXTRA[i].forEach((k) => KEYS.push(k));
        KEYS.push({ t: T.back[i] }, { t: T.back[i] + WQ[i], x: AGENT.x, y: agentY(i + 1), zoom: AGENT.zoom, curve: WHIP });
      }
      KEYS.push({ t: T.changes }, { t: T.changes + 0.467, y: CH.y + CH.h / 2, curve: 'cubicInOut' }, { t: T.wide }, { t: T.wide + 0.667, x: 960, y: 540, zoom: 1, curve: WHIP });
      function camera(t) {
        const cam = BM.cameraAt(t, KEYS);
        const hit = BM.shake(t, T.flipLand, { amp: 6, rot: 0.12, seed: 4 });
        return { x: cam.x + hit.x / cam.zoom, y: cam.y + hit.y / cam.zoom, zoom: cam.zoom, rot: (cam.rot || 0) + hit.rot };
      }
      const worldMatrix = (t) => BM.layerMatrix(camera(t));

      // ---- what is on screen, in screen pixels: the oracle and the blur both read this ------
      const onFrame = (b) => b.op > 0 && b.x < W && b.y < H && b.x + b.w > 0 && b.y + b.h > 0;
      function track(t) {
        const M = worldMatrix(t), out = {}, ir = irisAt(t);
        const put = (id, x, y, w, h, op) => {
          if (op === undefined) op = 1;
          if (!(op > 0) || !(w > 0) || !(h > 0)) return;
          const b = BM.boxToScreen(M, { x, y, w, h, op });
          if (onFrame(b)) out[id] = b;
        };
        if (!(t >= T.end && ir.covered)) {
          put('editor', 0, 0, W, H);
          put('agent', AG.x, TOP, AG.w, STATUS - TOP);
          put('timeline', TL.x, MID, TL.w, STATUS - MID);
          put('prompt', PB.x, PB.y, PB.w, PB.h);
          const v = viewerBox(t); put('viewer', v.x, v.y, v.w, v.h);
          const p = pointerAt(t); if (t > T.fileIn && t < T.send + 0.6) put('pointer', p.x, p.y, 20, 30);
          const g = ghostAt(t); if (g) put('file', g.x, g.y, g.w, g.h);
          if (t >= T.clipDrop) {
            const lim = TL.lane + (LEN * PPS + 70) * clipGrow(t);
            TRACKS.forEach((tr, i) => { const off = offOf(tr, t), x0 = X(0, t) + off; put(tr.id, x0, rowY(i, t), Math.min(X(LEN, t) + off, lim) - x0, ROW_H); });
            if (t >= T.slide[2] + 0.3) put('tail', X(74.1, t), rowY(0, t), X(LEN, t) - X(74.1, t), 4 * (ROW_H + RG));
          }
          if (t >= T.card[1]) { const pb = passBox(t); put('passage', pb.x, pb.y, pb.w, pb.h); }
          T.mk.forEach((tm, i) => { if (t >= tm) put('mark' + i, X(PICK[i], t) - 7, TL.ruler - BM.cardPop(t, tm).dy, 14, 30); });
          if (t >= T.send + 0.033) { const m = msgBox(t); put('msg', m.x, m.y, m.w, m.h); }
          CARDS.forEach((cd, i) => { if (t >= T.card[i]) { const pop = BM.cardPop(t, T.card[i]), r = cardRect(i); put('card' + (i + 1), r.x, r.y + pop.dy, r.w, r.h, pop.op); } });

        const ir = irisAt(t);
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.save(); c.beginPath(); c.arc(49, 26, ir.r, 0, Math.PI * 2); c.clip();
        c.fillStyle = C.ground; c.fillRect(0, 0, W, H);
        const l1 = line1(t);
        if (l1.visible) { c.save(); c.beginPath(); c.rect(W / 2 - L1W / 2 - 20, LINE1_Y - 40, L1W + 40, 80); c.clip(); label(c, LINE1, W / 2, LINE1_Y + l1.y, 63, 600, C.ink, 'center'); c.restore(); }
        const l2 = line2(t);
        if (l2.visible) { c.save(); c.beginPath(); c.rect(W / 2 - L2W / 2 - 20, LINE2_Y - 26, L2W + 40, 52); c.clip(); label(c, LINE2, W / 2, LINE2_Y + l2.y, 39, 400, C.mute, 'center'); c.restore(); }
        c.restore();
        drawLockup(c, logoBox(t));
      }

      function draw(c, t) {
        c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
        c.fillStyle = C.ground; c.fillRect(0, 0, W, H);
        const ending = t >= T.end, ir = ending ? irisAt(t) : null;
        if (!(ending && ir.covered)) {
          const M = worldMatrix(t);
          c.setTransform(...BM.matCanvas(M));
          drawPool(c, t); drawViewer(c, t); drawInspector(c, t); drawTimeline(c, t); drawAgent(c, t); drawStatus(c, t); drawTop(c, t);
          drawPointer(c, t, M);
        }
        if (ending) drawEnd(c, t);
      }

      // ---- the frame: a 180 degree shutter, with as many sub-frames as the travel needs ------
      const view = document.getElementById('c'), out = view.getContext('2d');
      const scratch = document.createElement('canvas'); scratch.width = W; scratch.height = H;
      const sc = scratch.getContext('2d');
      const SHUTTER = 0.5 / FPS;
      function travel(t0, t1) {
        const a = track(t0), b = track(t1);
        let far = BM.frameTravel(camera(t0), camera(t1));
        for (const id in a) if (b[id] && id !== 'editor') far = Math.max(far, BM.boxTravel(a[id], b[id]));
        return far;
      }
      function time(t) {
        const open = t - SHUTTER / 2, n = BM.blurSamples(travel(open, open + SHUTTER));
        if (n === 1) { draw(out, t); return; } // a hold is drawn once, exactly at t: dead still
        for (let i = 0; i < n; i++) {
          draw(sc, open + (SHUTTER * (i + 0.5)) / n);
          out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1 / (i + 1); out.drawImage(scratch, 0, 0);
        }
        out.globalAlpha = 1;
      }

      // ---- what bay and its tools read -------------------------------------------------------
      const r3 = (v) => Math.round(v * 1000) / 1000;
      const sxAt = (t, x, y) => BM.toScreen(worldMatrix(t), x, y)[0];
      const pan = (x) => Math.round(BM.clamp((x / (W / 2) - 1) * 0.3, -0.3, 0.3) * 100) / 100; // gentle: never past 0.3
      window.__film = {
        beats: [0, T.fileIn, T.toPrompt, T.send, T.out[0], T.slide[0], T.slide[1], T.slide[2], T.back[0], T.out[1], T.back[1], T.out[2], T.up, T.back[2],
          T.out[3], T.close, T.back[3], T.out[4], T.back[4], T.out[5], T.back[5], T.out[6], T.flip, T.back[6], T.changes, T.wide, T.end].map(r3),
        cuts: [],
        inFrame: {
          editor: [0, T.end], prompt: [T.promptClick, T.send], viewer: [T.out[6] + 0.5, T.back[6]],
          logo: [T.logoLand + 0.2, DUR, 'whole'], line1: [T.line1 + 0.7, DUR, 'whole'], line2: [T.line2 + 0.7, DUR, 'whole']
        },
        blur: true, // time(t) draws its own motion blur, above
        track,
        // Every sound takes its time from the table the picture is drawn from: same event, same frame.
        events: () => {
          const ev = [], add = (t, what, material, gain, x, more) => ev.push(Object.assign({ t: r3(t), material, gain, pan: pan(x), what }, more || {}));
          add(T.poolDrop, 'four files land in the media pool', 'drop', 0.4, sxAt(T.poolDrop, 200, 350), { pitch: -3 });
          add(T.clipDrop, 'four clips land on the timeline', 'knock', 0.5, sxAt(T.clipDrop, 650, 770), { size: 1.3, brightness: 0.4 });
          for (let i = 7; i < SENT.length; i += 8) { // one soft tick every eighth key, on a letter that shows
            const k = SENT[i] === ' ' ? i + 1 : i;
            add(keyTime(k), 'key ' + (k + 1) + ' (“' + SENT[k] + '”) appears', 'knock', 0.15, sxAt(keyTime(k), PB.x + 200, PB.y + 40), { size: 0.5, brightness: 0.7 });
          }
          add(T.send - 0.1, 'send is pressed', 'knock', 0.42, sxAt(T.send - 0.1, PB.x + PB.w - 28, PB.y + 112), { size: 1.1, brightness: 0.45 });
          CARDS.forEach((cd, i) => {
            add(T.card[i], cd.name + ' card appears', 'drop', 0.34, sxAt(T.card[i], 1680, 300), { pitch: -2, size: 0.8 });
            add(T.done[i], cd.name + ' card turns to ✓', 'bell', 0.34, sxAt(T.done[i], 1680, 300), { pitch: [0, 2, 4, 5, 7, 9, 11][i], size: 0.9 }); // one step up per card
          });
          add(T.out[0], 'camera whips to the timeline', 'whoosh', 0.22, 800, { size: 0.9 });
          add(T.out[6], 'camera whips to the viewer', 'whoosh', 0.22, 800, { size: 0.9 });
          add(T.flipLand, 'the frame lands at 9:16', 'thump', 0.9, sxAt(T.flipLand, VC.x, VC.y));                 // the one big hit
          add(T.wide, 'camera pulls back to the whole editor', 'whoosh', 0.24, 960, { size: 1.2 });
          [12, 16, 19].forEach((p) => add(T.logoLand, 'the name lands', 'bell', 0.42, 960, { pitch: p, size: 1.6 })); // the steps resolve
          return ev.sort((a, b) => a.t - b.t);
        }
      };
      time(0);
      window.__timelines['bay-launch'] = { time, duration: () => DUR };
    </script>
  </body>
</html>
