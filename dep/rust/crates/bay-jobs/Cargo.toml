[package]
name = "bay-jobs"
version = "0.1.0"
edition = "2024"
description = "One registry for work that takes longer than a request: installs, renders, narration."

# Deliberately no internal dependencies. This crate sits at the bottom of the graph so
# bay-provision, bay-agent, bay-mcp and bay-ui can all reach it. Putting the registry in
# bay-core would force bay-provision to depend on bay-core; putting it in bay-agent would
# cycle, because bay-agent already depends on bay-provision.
[dependencies]
serde_json = "1"
