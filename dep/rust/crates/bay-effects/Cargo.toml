[package]
name = "bay-effects"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/effects.rs"
crate-type = ["rlib"]

[dependencies]
bytemuck = { workspace = true }
# LUTs upload as Rgba16Float: the only float format guaranteed filterable, and far more
# precision than a 33-entry cube needs.
half = { version = "2", features = ["bytemuck"] }
bay-gpu = { version = "0.1.0", path = "../bay-gpu" }
# For the look *vocabulary* only. `bay-core` has to validate a look id and cannot
# depend on wgpu to do it, so the ids live in bay-project and a test here pins
# them to the looks defined in this crate, in both directions.
bay-project = { version = "0.1.0", path = "../bay-project" }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# T-002 capability gate: hands out a real GpuContext, or skips (panics under BAY_REQUIRE_GPU).
bay-test-support = { version = "0.1.0", path = "../bay-test-support", features = ["gpu"] }
