<!doctype html>
<html data-composition-variables='[
  {
    "id": "to",
    "type": "number",
    "label": "Count to",
    "default": 1438
  },
  {
    "id": "caption",
    "type": "string",
    "label": "Caption",
    "default": "frames, all of them"
  },
  {
    "id": "ink",
    "type": "color",
    "label": "Number",
    "default": "#FFFFFF"
  },
  {
    "id": "y",
    "type": "number",
    "label": "Y from top",
    "default": 16,
    "min": 0,
    "max": 85,
    "unit": "%"
  }
]'>
<head><meta charset="utf-8"><title>stat</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  /* Size-aware. The root's width and height are rewritten to the timeline's canvas when bay
     instantiates this template, and nothing below is in fixed pixels: the root is a size
     container and --u is one pixel of a frame whose short side is 1080, so every length is a
     multiple of it and positions are percentages of the frame. The same file lays out at
     1080x1920, 1920x1080, 1080x1080 or 3840x2160 without a second copy. */
  .root{position:relative;overflow:hidden;container-type:size;--u:calc(100cqmin / 1080);font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div class="root" data-composition-id="stat" data-duration="3" style="width:1080px;height:1920px">
  <div id="wrap" style="position:absolute;left:calc(60*var(--u));right:calc(60*var(--u));top:var(--y,16%);text-align:center;opacity:0">
    <div id="n" style="color:var(--ink,#fff);font-size:calc(150*var(--u));font-weight:900;letter-spacing:-0.04em;
         line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 calc(8*var(--u)) calc(34*var(--u)) rgba(0,0,0,.8)">0</div>
    <div id="c" data-var-text="caption" style="color:#fff;opacity:.82;font-size:calc(40*var(--u));font-weight:700;
         margin-top:calc(10*var(--u));text-shadow:0 calc(4*var(--u)) calc(20*var(--u)) rgba(0,0,0,.8)">frames, all of them</div>
  </div>
</div>
<script>
(function () {
  var DUR = 3;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
  function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3) }
  /* In for `hold`, steady, then out over the same time. A single number every template
     shares, so they enter and leave alike when several are cut together. */
  function envelope(time, hold) {
    var up = ease(time / hold)
    var down = time > DUR - hold ? 1 - clamp((time - (DUR - hold)) / hold, 0, 1) : 1
    return up * down
  }
  var wrap = document.getElementById('wrap'), n = document.getElementById('n');
  function at(time) {
    var v = envelope(time, 0.28)
    wrap.style.opacity = v
    // The count is a pure function of time, so scrubbing backwards counts back down and any
    // frame can be rendered alone. A counter that incremented per call could not be seeked.
    var target = parseFloat(getComputedStyle(wrap.parentNode).getPropertyValue('--to')) || 0
    n.textContent = String(Math.round(target * ease(time / (DUR * 0.55))))
    return time / DUR
  }
  at(0);
  window.__timelines['stat'] = { time: at, duration: function () { return DUR } };
})();
</script>
</body>
</html>
