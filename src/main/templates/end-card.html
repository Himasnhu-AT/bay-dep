<!doctype html>
<html data-composition-variables='[
  {
    "id": "line",
    "type": "string",
    "label": "Call to action",
    "default": "follow for more"
  },
  {
    "id": "handle",
    "type": "string",
    "label": "Handle",
    "default": "@codesapiens"
  },
  {
    "id": "accent",
    "type": "color",
    "label": "Accent",
    "default": "#11D1A0"
  }
]'>
<head><meta charset="utf-8"><title>end-card</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  .root{position:relative;overflow:hidden;font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div class="root" data-composition-id="end-card" data-duration="4" style="width:1080px;height:1920px">
  <div id="scrim" style="position:absolute;inset:0;background:#08080A;opacity:0"></div>
  <div id="wrap" style="position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);text-align:center">
    <div id="l" data-var-text="line" style="color:#fff;font-size:76px;font-weight:900;
         letter-spacing:-0.03em;opacity:0">follow for more</div>
    <div id="h" data-var-text="handle" style="color:var(--accent,#11D1A0);font-size:52px;
         font-weight:800;margin-top:12px;opacity:0">@codesapiens</div>
  </div>
</div>
<script>
(function () {
  var DUR = 4;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
  function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3) }
  /* In for `hold`, steady, then out over the same time. A single number every template
     shares, so they enter and leave alike when several are cut together. */
  function envelope(time, hold) {
    var up = ease(time / hold)
    var down = time > DUR - hold ? 1 - clamp((time - (DUR - hold)) / hold, 0, 1) : 1
    return up * down
  }
  var scrim = document.getElementById('scrim'), l = document.getElementById('l'),
      h = document.getElementById('h');
  function at(time) {
    scrim.style.opacity = (ease(time / 0.5) * 0.78).toFixed(4)
    var lp = ease((time - 0.15) / 0.5)
    l.style.opacity = lp.toFixed(4)
    l.style.transform = 'translateY(' + ((1 - lp) * 24).toFixed(2) + 'px)'
    var hp = ease((time - 0.38) / 0.5)
    h.style.opacity = hp.toFixed(4)
    h.style.transform = 'translateY(' + ((1 - hp) * 20).toFixed(2) + 'px)'
    return time / DUR
  }
  at(0);
  window.__timelines['end-card'] = { time: at, duration: function () { return DUR } };
})();
</script>
</body>
</html>
