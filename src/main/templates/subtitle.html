<!doctype html>
<html data-composition-variables='[
  {
    "id": "text",
    "type": "string",
    "label": "Subtitle",
    "default": "Everything you do lands in the same document."
  },
  {
    "id": "size",
    "type": "number",
    "label": "Text size",
    "default": 64,
    "min": 24,
    "max": 120
  },
  {
    "id": "bottom",
    "type": "number",
    "label": "Distance from bottom",
    "default": 11,
    "min": 0,
    "max": 90,
    "unit": "%"
  },
  {
    "id": "ink",
    "type": "color",
    "label": "Text",
    "default": "#FFFFFF"
  },
  {
    "id": "pill",
    "type": "boolean",
    "label": "Dark pill behind",
    "default": true
  }
]'>
<head><meta charset="utf-8"><title>subtitle</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  /* Size-aware. The root's width and height are rewritten to the timeline's canvas when bay
     instantiates this template, and nothing below is in fixed pixels: the root is a size
     container and --u is one pixel of a frame whose short side is 1080, so every length is a
     multiple of it and positions are percentages of the frame. The same file lays out at
     1080x1920, 1920x1080, 1080x1080 or 3840x2160 without a second copy. */
  .root{position:relative;overflow:hidden;container-type:size;--u:calc(100cqmin / 1080);font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div class="root" data-composition-id="subtitle" data-duration="3" style="width:1080px;height:1920px">
  <div id="wrap" style="position:absolute;left:calc(60*var(--u));right:calc(60*var(--u));bottom:var(--bottom,11%);text-align:center">
    <span id="t" data-var-text="text"
      style="display:inline-block;color:var(--ink,#fff);font-size:calc(var(--size,64)*var(--u));max-width:calc(1600*var(--u));box-sizing:border-box;font-weight:800;
             letter-spacing:-0.015em;line-height:1.18;padding:calc(14*var(--u)) calc(26*var(--u));border-radius:calc(16*var(--u));
             text-shadow:0 calc(6*var(--u)) calc(28*var(--u)) rgba(0,0,0,.7)">Everything you do lands in the same document.</span>
  </div>
</div>
<script>
(function () {
  var DUR = 3;
  /* The script's own lengths scale with the frame the same way --u does in the CSS. */
  var ROOT = document.querySelector('[data-composition-id]');
  var U = Math.min(ROOT.offsetWidth, ROOT.offsetHeight) / 1080;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
  function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3) }
  /* In for `hold`, steady, then out over the same time. A single number every template
     shares, so they enter and leave alike when several are cut together. */
  function envelope(time, hold) {
    var up = ease(time / hold)
    var down = time > DUR - hold ? 1 - clamp((time - (DUR - hold)) / hold, 0, 1) : 1
    return up * down
  }
  var wrap = document.getElementById('wrap'), t = document.getElementById('t');
  function at(time) {
    // The pill is a declared boolean, so it arrives as the CSS custom property `--pill`
    // holding the string "true" or "false" — read once per seek rather than cached, because
    // a seek may follow a variable change.
    var pill = (getComputedStyle(t.parentNode.parentNode).getPropertyValue('--pill') || '').trim()
    t.style.background = pill === 'false' ? 'transparent' : 'rgba(10,10,12,.62)'
    var v = envelope(time, 0.22)
    wrap.style.opacity = v
    wrap.style.transform = 'translateY(' + ((1 - v) * 22 * U).toFixed(2) + 'px)'
    return time / DUR
  }
  at(0);
  window.__timelines['subtitle'] = { time: at, duration: function () { return DUR } };
})();
</script>
</body>
</html>
