<!doctype html>
<html data-composition-variables='[
  {
    "id": "kicker",
    "type": "string",
    "label": "Kicker",
    "default": "A SHORT FILM ABOUT"
  },
  {
    "id": "title",
    "type": "string",
    "label": "Title",
    "default": "Overthinking"
  },
  {
    "id": "accent",
    "type": "color",
    "label": "Kicker colour",
    "default": "#FF4D3D"
  },
  {
    "id": "scrim",
    "type": "number",
    "label": "Scrim strength",
    "default": 0.72,
    "min": 0,
    "max": 1
  }
]'>
<head><meta charset="utf-8"><title>title-card</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  .root{position:relative;overflow:hidden;font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div class="root" data-composition-id="title-card" data-duration="3.5" style="width:1080px;height:1920px">
  <div id="scrim" style="position:absolute;inset:0;background:#08080A;opacity:0"></div>
  <div id="wrap" style="position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);text-align:center">
    <div id="k" data-var-text="kicker" style="color:var(--accent,#FF4D3D);font-size:34px;font-weight:800;
         letter-spacing:.3em;opacity:0">A SHORT FILM ABOUT</div>
    <div id="ti" data-var-text="title" style="color:#fff;font-size:128px;font-weight:900;
         letter-spacing:-0.04em;line-height:1.02;margin-top:14px;opacity:0">Overthinking</div>
    <div id="rule" style="height:6px;background:var(--accent,#FF4D3D);margin:26px auto 0;width:220px;
         transform:scaleX(0);transform-origin:center"></div>
  </div>
</div>
<script>
(function () {
  var DUR = 3.5;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
  function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3) }
  /* In for `hold`, steady, then out over the same time. A single number every template
     shares, so they enter and leave alike when several are cut together. */
  function envelope(time, hold) {
    var up = ease(time / hold)
    var down = time > DUR - hold ? 1 - clamp((time - (DUR - hold)) / hold, 0, 1) : 1
    return up * down
  }
  var scrim = document.getElementById('scrim'), k = document.getElementById('k'),
      ti = document.getElementById('ti'), rule = document.getElementById('rule');
  function at(time) {
    var v = envelope(time, 0.4)
    var strength = parseFloat(getComputedStyle(scrim.parentNode).getPropertyValue('--scrim')) || 0.72
    scrim.style.opacity = (v * strength).toFixed(4)
    k.style.opacity = (ease(time / 0.4) * v).toFixed(4)
    var tp = ease((time - 0.12) / 0.5)
    ti.style.opacity = (tp * v).toFixed(4)
    ti.style.transform = 'translateY(' + ((1 - tp) * 26).toFixed(2) + 'px)'
    rule.style.transform = 'scaleX(' + (ease((time - 0.3) / 0.45) * v).toFixed(4) + ')'
    return time / DUR
  }
  at(0);
  window.__timelines['title-card'] = { time: at, duration: function () { return DUR } };
})();
</script>
</body>
</html>
