<!doctype html>
<html data-composition-variables='[
  {
    "id": "name",
    "type": "string",
    "label": "Name",
    "default": "Your Name"
  },
  {
    "id": "role",
    "type": "string",
    "label": "Title or role",
    "default": "Title or role"
  },
  {
    "id": "accent",
    "type": "color",
    "label": "Accent",
    "default": "#11D1A0"
  },
  {
    "id": "bottom",
    "type": "number",
    "label": "Distance from bottom",
    "default": 24,
    "min": 0,
    "max": 90,
    "unit": "%"
  }
]'>
<head><meta charset="utf-8"><title>lower-third</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  /* Size-aware. The root's width and height are rewritten to the timeline's canvas when bay
     instantiates this template, and nothing below is in fixed pixels: the root is a size
     container and --u is one pixel of a frame whose short side is 1080, so every length is a
     multiple of it and positions are percentages of the frame. The same file lays out at
     1080x1920, 1920x1080, 1080x1080 or 3840x2160 without a second copy. */
  .root{position:relative;overflow:hidden;container-type:size;--u:calc(100cqmin / 1080);font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
</style></head>
<body>
<div class="root" data-composition-id="lower-third" data-duration="4" style="width:1080px;height:1920px">
  <div id="wrap" style="position:absolute;left:calc(70*var(--u));bottom:var(--bottom,24%);opacity:0">
    <div style="display:flex;align-items:stretch">
      <div id="bar" style="width:calc(10*var(--u));background:var(--accent,#11D1A0);border-radius:calc(5*var(--u));
           transform-origin:bottom center"></div>
      <div style="padding-left:calc(22*var(--u))">
        <div id="nm" data-var-text="name" style="color:#fff;font-size:calc(68*var(--u));font-weight:900;
             letter-spacing:-0.02em;text-shadow:0 calc(6*var(--u)) calc(26*var(--u)) rgba(0,0,0,.75)">Your Name</div>
        <div id="rl" data-var-text="role" style="color:var(--accent,#11D1A0);font-size:calc(38*var(--u));
             font-weight:700;margin-top:calc(4*var(--u));text-shadow:0 calc(4*var(--u)) calc(18*var(--u)) rgba(0,0,0,.8)">Title or role</div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var DUR = 4;
  /* The script's own lengths scale with the frame the same way --u does in the CSS. */
  var ROOT = document.querySelector('[data-composition-id]');
  var U = Math.min(ROOT.offsetWidth, ROOT.offsetHeight) / 1080;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
  function ease(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3) }
  /* In for `hold`, steady, then out over the same time. A single number every template
     shares, so they enter and leave alike when several are cut together. */
  function envelope(time, hold) {
    var up = ease(time / hold)
    var down = time > DUR - hold ? 1 - clamp((time - (DUR - hold)) / hold, 0, 1) : 1
    return up * down
  }
  var wrap = document.getElementById('wrap'), bar = document.getElementById('bar'),
      nm = document.getElementById('nm'), rl = document.getElementById('rl');
  function at(time) {
    var v = envelope(time, 0.3)
    wrap.style.opacity = v
    bar.style.transform = 'scaleY(' + ease(time / 0.4).toFixed(4) + ')'
    nm.style.transform = 'translateX(' + ((1 - ease(time / 0.42)) * -26 * U).toFixed(2) + 'px)'
    rl.style.transform = 'translateX(' + ((1 - ease((time - 0.09) / 0.42)) * -26 * U).toFixed(2) + 'px)'
    return time / DUR
  }
  at(0);
  window.__timelines['lower-third'] = { time: at, duration: function () { return DUR } };
})();
</script>
</body>
</html>
