<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>bay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer loads nothing over the network. Media reaches it through the bay://
      protocol registered in the main process, which is why no remote origins appear here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: bay:; media-src 'self' blob: bay:; font-src 'self' data:; connect-src 'self' bay:"
    />
  </head>
  <body class="bg-surface-0 text-ink-0 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
