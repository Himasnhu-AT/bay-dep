<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>bay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer loads nothing over the network. Media reaches it through the bay://
      protocol registered in the main process, which is why no remote origins appear here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: bay:; media-src 'self' blob: bay:; font-src 'self' data: bay:; connect-src 'self' bay:"
    />
    <!--
      Sets data-theme on <html> before first paint. Classic and synchronous on purpose: the
      parser waits for it, so no frame is ever drawn in the wrong palette. See the file.
      `vite-ignore` tells Vite this is deliberately not a module; it copies it from public/.
    -->
    <script vite-ignore src="./theme.js"></script>
  </head>
  <body class="bg-surface-0 text-ink-0 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
